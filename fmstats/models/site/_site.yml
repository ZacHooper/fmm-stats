        description: 'Ours, the final score. {{ doc("goals_for") }}'
      - name: ga
        description: 'Theirs, the final score. {{ doc("goals_against") }}'
      - name: result
        description: 'Ours. {{ doc("result") }}'
      - name: pts
        description: 'Our points from the match. {{ doc("points") }}'
      - name: formation
        description: 'Ours, as the match table stores it. {{ doc("formation") }}'
      - name: attendance
        description: '{{ doc("attendance") }}'
      - name: stage_kind
        description: '{{ doc("stage_type") }}'
      - name: stage
        description: '{{ doc("stage") }}'
      - name: matchday
        description: 'From 1 in a league or group stage; NULL otherwise. {{ doc("matchday") }}'
      - name: leg
        description: 'Set only in a two-legged tie. {{ doc("leg") }}'
      - name: tie_gf
        description: 'Our aggregate in a two-legged tie, once both legs are played; NULL otherwise.
          {{ doc("goals_for") }}'
      - name: tie_ga
        description: 'Their aggregate in a two-legged tie, once both legs are played; NULL
          otherwise. {{ doc("goals_against") }}'
      - name: went_through
