version: 2
models:
  - name: dim_position
    description: >
      The fifteen positions: code, unit, display order.
    data_tests:
      - unique_combination: {arguments: {columns: [position]}}
  - name: dim_role
    description: >
      The player roles by id; a role names no position.
    data_tests:
      - unique_combination: {arguments: {columns: [role_id]}}
  - name: dim_city
    description: >
      Each city, as its latest snapshot gives it.
    data_tests:
      - unique_combination: {arguments: {columns: [city_id]}}
  - name: dim_stadium
    description: >
      Each stadium and its city; name and capacity are on fact_stadium_snapshot.
    data_tests:
      - unique_combination: {arguments: {columns: [stadium_id]}}
  - name: dim_nation
    description: >
      Each nation as a place; ranking, coefficients and languages are on fact_nation_snapshot.
    data_tests:
      - unique_combination: {arguments: {columns: [nation_id]}}
  - name: fact_nation_snapshot
    description: >
      Each nation on each snapshot: ranking and the two histories.
    data_tests:
      - unique_combination: {arguments: {columns: [nation_id, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [nation_id]
            to: ref('dim_nation')
            to_columns: [nation_id]
  - name: dim_club
    description: >
      Each club: its first team's name and nations.
    data_tests:
      - unique_combination: {arguments: {columns: [club_tid]}}
  - name: dim_team
    description: >
      Each team, the side that plays, with the club that owns it and its team type.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid]}}
      - relationship_combination:
          arguments:
            columns: [club_tid]
            to: ref('dim_club')
            to_columns: [club_tid]
  - name: fact_club_snapshot
    description: >
      Each club on each snapshot: what its teams share.
    data_tests:
      - unique_combination: {arguments: {columns: [club_tid, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [club_tid]
            to: ref('dim_club')
            to_columns: [club_tid]
      - relationship_combination:
          arguments:
            columns: [stadium_id]
            to: ref('dim_stadium')
            to_columns: [stadium_id]
  - name: fact_team_snapshot
    description: >
      Each team on each snapshot: what each side holds on its own.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
      - relationship_combination:
          arguments:
            columns: [stadium_id]
            to: ref('dim_stadium')
            to_columns: [stadium_id]
  - name: fact_stadium_snapshot
    description: >
      Each stadium on each snapshot: name, capacity, expansion capacity.
    data_tests:
      - unique_combination: {arguments: {columns: [stadium_id, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [stadium_id]
            to: ref('dim_stadium')
            to_columns: [stadium_id]
  - name: dim_competition
    description: >
      Each competition: names, type, nation, tier and parent.
    data_tests:
      - unique_combination: {arguments: {columns: [cid]}}
  - name: fact_competition_snapshot
    description: >
      Each competition on each snapshot: reputation.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
  - name: dim_stage
    description: >
      Each stage of a competition season: format, name, teams, groups, final stage.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
  - name: dim_round
    description: >
      Each round of a knockout stage: name, teams, legs.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index, round_index]}}
      - relationship_combination:
          arguments:
            columns: [cid, competition_season, stage_index]
            to: ref('dim_stage')
            to_columns: [cid, competition_season, stage_index]
  - name: dim_match
    description: >
      Every match in the world: competition, stage and round where known, tie and leg, how it was decided, has_detail for ours.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id]}}
      - unique_combination: {arguments: {columns: [match_date, home_team_tid, away_team_tid]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
      - relationship_combination:
          arguments:
            columns: [home_team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
      - relationship_combination:
          arguments:
            columns: [away_team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
    columns:
      - name: home_team_tid
        data_tests:
          - in_range: {arguments: {min_value: 0, max_value: "{{ var('match_id_tid_base') - 1 }}"}}
      - name: away_team_tid
        data_tests:
          - in_range: {arguments: {min_value: 0, max_value: "{{ var('match_id_tid_base') - 1 }}"}}
  - name: fact_team_match
    description: >
      Each match twice, once per side: goals, shoot-out, result, points.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, team_tid]}}
      - relationship_combination:
          arguments:
            columns: [match_id]
            to: ref('dim_match')
            to_columns: [match_id]
  - name: dim_event_type
    description: >
      Every match event type, named or not, with its role in the score and in a player's minutes.
    data_tests:
      - unique_combination: {arguments: {columns: [event_type_code]}}
  - name: dim_period
    description: >
      The periods of a match in order, with the minutes each holds.
    data_tests:
      - unique_combination: {arguments: {columns: [period]}}
  - name: fact_player_match
    description: >
      Each player's line in our own matches, both sides: started, appeared, minutes with extra time, stats.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, player_tid]}}
      - relationship_combination:
          arguments:
            columns: [match_id]
            to: ref('dim_match')
            to_columns: [match_id]
      - relationship_combination:
          arguments:
            columns: [team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
      - relationship_combination:
          arguments:
            columns: [position]
            to: ref('dim_position')
            to_columns: [position]
    columns:
      - name: minutes
        data_tests:
          - not_null
          - in_range: {arguments: {min_value: 0, max_value: 120}}
  - name: fact_match_event
    description: >
      The events of our own matches in order: minute, period, type, player and the side it counts for.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, event_index]}}
      - relationship_combination:
          arguments:
            columns: [match_id]
            to: ref('dim_match')
            to_columns: [match_id]
      - relationship_combination:
          arguments:
            columns: [event_type_code]
            to: ref('dim_event_type')
            to_columns: [event_type_code]
      - relationship_combination:
          arguments:
            columns: [period]
            to: ref('dim_period')
            to_columns: [period]
    columns:
      - name: period
        data_tests: [not_null]
      - name: team_tid
        data_tests: [not_null]
  - name: tie_results
    description: >
      Each knockout tie: teams, aggregate, shoot-out, how it was decided and the winner. A view.
    data_tests:
      - unique_combination: {arguments: {columns: [tie_id]}}
      - relationship_combination:
          arguments:
            columns: [cid, competition_season, stage_index]
            to: ref('dim_stage')
            to_columns: [cid, competition_season, stage_index]
  - name: standings
    description: >
      Each league or group stage's table after every matchday. A view.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index, stage_key, matchday, team_tid]}}
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index, stage_key, matchday, position]}}
  - name: fact_participation
    description: >
      Each team in each competition season it has a labelled match in, and how far it went.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid, cid, competition_season]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
      - relationship_combination:
          arguments:
            columns: [team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
  - name: fact_competition_outcome
    description: >
      How each team's competition season ended: stage reached, final and table position, winner.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid, cid, competition_season]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
  - name: dim_person
    description: >
      Every person in any snapshot: name, date of birth, and the club and season of the oldest
      career line any snapshot holds.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id]}}
  - name: fact_player_snapshot
    description: >
      Each player on each snapshot: team, ratings, ability, value (stated or estimated),
      reputation, contract, training, nationality, caps.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('dim_person')
            to_columns: [person_id]
      - relationship_combination:
          arguments:
            columns: [team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
      - relationship_combination:
          arguments:
            columns: [nationality_id]
            to: ref('dim_nation')
            to_columns: [nation_id]
    columns:
      - name: contract_status
        data_tests:
          - accepted_values: {arguments: {values: [contracted, expired, free_agent]}}
  - name: fact_staff_snapshot
    description: >
      Each member of staff on each snapshot: team, coaching ability, reputation, formations,
      Style.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('dim_person')
            to_columns: [person_id]
  - name: fact_injury_spell
    description: >
      Each injury of a player in our squad or reserves, from the weekly Player Progress rows.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, start_date]}}
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('dim_person')
            to_columns: [person_id]
  - name: fact_player_season
    description: >
      Every season line of every player's career history, unioned across snapshots.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, line_index]}}
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('dim_person')
            to_columns: [person_id]
  - name: fact_player_competition_season
    description: >
      Each player's season in each competition for each team, summed from our own matches.
    data_tests:
      - unique_combination: {arguments: {columns: [season, player_tid, team_tid, cid]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('dim_person')
            to_columns: [person_id]
  - name: dim_award
    description: The awards the save records (var('awards')).
    data_tests:
      - unique_combination: {arguments: {columns: [award_id]}}
  - name: fact_player_award
    description: >
      Each player's place in a World Best XI pool, with the scrapbook entry that earned it.
    data_tests:
      - unique_combination: {arguments: {columns: [award_id, player_tid, entry_date]}}
      - relationship_combination:
          arguments:
            columns: [award_id]
            to: ref('dim_award')
            to_columns: [award_id]
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('dim_person')
            to_columns: [person_id]
