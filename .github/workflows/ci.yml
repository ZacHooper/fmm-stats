name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      # Most parser tests need real saves, which are never in the repo; they skip here and the
      # runner reports them as skipped. The unit tests run, and the runner fails if none did.
      - name: Unit tests
        run: uv run python tests/run_tests.py
      - name: Layer boundaries
        run: uv run python tests/test_boundary.py
      # Every mart/site column points at a shared doc block (fmstats/models/_docs/), built into an
      # empty store so no data is needed. --strict: a column named as a block's listed synonym
      # fails too, so each concept keeps one name.
      - name: Column definitions
        run: uv run python scripts/check_dbt_docs.py --empty-store --strict
      - name: Worker syntax
        run: node --check site-worker/index.js
      # Every repo path and relative link in the docs must resolve. Non-blocking until the docs
      # overhaul's phase 7 (docs/plans/2026-11-07-docs-overhaul.html) clears the backlog.
      - name: Docs references
        continue-on-error: true
        run: uv run python scripts/check_docs.py --summary
