  - name: player_value_reserve_takes_first_team_league
    description: >
      log(value) is the seeded linear model. A reserve side's player takes his first team's
      league reputation and the reserve term; a player with no reputation gets no row.
    model: int_player_value
    given:
      - input: ref('stg_value_model')
        rows:
          - {term: intercept, coefficient: 0}
          - {term: ca, coefficient: 0}
          - {term: pa, coefficient: 0}
