  - name: transfers_from_career_lines
    description: >
      A move is a club change between two lines that are not loans, at club level, with the
      fee from the selling club's line: a loan line between two lines at one club is no move,
      a move into a Free agent line is a release (no row), the move out of it a free agent
      signing (no from club, free), a reserve side's line is its club's, and a move out of a
      youth side (a team with no club record) is none unless the snapshot before shows a free
      agent. The club on the newest snapshot ends the
      history: a move to it the history has no line for yet is a move too, seasoned by its
      joined date and bounded by the two snapshots that show it. A joined date reset by a
      return from loan is not the move's date.
