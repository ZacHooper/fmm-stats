[project]
name = "fm-parser-loader"
version = "0.1.0"
description = "DuckDB ETL + query CLI over fm-parser extract outputs"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
]

# The extractors (extract.py, dump_*.py, fmparser/*) are pure-stdlib and must stay
# dependency-free. duckdb is imported only by load_duckdb.py / fmq.py, run via uv.
# package = false: this is a workspace of scripts, not an installable package.
[tool.uv]
package = false
