version: 2
models:
  - name: int_staff_snapshots
    description: >
      Each staff member on each snapshot, with his staff record where the save holds one,
      the formation names, Style and the reputation tier.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
  - name: int_person_names
    description: >
      Each person's name parts on each snapshot; `name` is the display name: the common name
      when he has one, else first + last.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
  - name: int_person_snapshots
    description: (snapshot_date, tid) -> person_id, the join every fact uses.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('int_persons')
            to_columns: [person_id]
  - name: int_persons
    description: >
      One row per person across every snapshot, so a retired player whose slot has gone to a
      newgen keeps his history.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id]}}
  - name: int_team_squads
    description: >
      Every team's squad listing on each snapshot, with the team's type and the club that owns
      it. A player can be listed by more than one team.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, team_tid, player_tid]}}
  - name: int_managed_squad
    description: >
      Our squad on each snapshot: every player the managed club's teams list, in the first team
      when both list him.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
  - name: int_scrapbook_entries
    description: >
      Each player's latest entry in our club's Scrapbook lists on each snapshot, with is_fresh
      for one recent enough to stand in for his record.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, player_tid]}}
  - name: int_player_info
    description: >
      Each player on each snapshot, everything except how he is rated: identity, club, CA/PA,
      reputation, build, caps, the name and value our squad's entries give, his current
      contract and his training.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, tid]
            to: ref('int_person_snapshots')
            to_columns: [snapshot_date, tid]
  - name: int_team_leagues
    description: >
      Each team's league on each snapshot (the newest its record named on or before it) and
      that league's reputation then.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, team_tid]}}
  - name: int_player_value_inputs
    description: >
      The transfer-value model's inputs for every player: ability, reputation, the league
      reputation it counts (a reserve side's is its first team's), age and the value the
      save states. What int_player_value scores and scripts/fit_value_model.py fits on.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, tid]
            to: ref('int_player_info')
            to_columns: [snapshot_date, tid]
  - name: int_player_value
    description: >
      The transfer-value model (stg.value_model) scored for every player it has inputs for,
      with whether the estimate lies in the band it was validated in.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, tid]
            to: ref('int_player_info')
            to_columns: [snapshot_date, tid]
  - name: int_player_career_lines
    description: >
      Every career-history line each person has held in any snapshot, in order: the newest
      snapshot's lines, after the lines older snapshots held that later ones dropped.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, line_index]}}
  - name: int_progress_spells
    description: >
      Each tracked player's spells injured, in the off-season week and out on loan: runs of
      flagged weeks in Player Progress, every snapshot's copies OR-ed together.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, spell_type, start_date]}}
    columns:
      - name: spell_type
        data_tests:
          - accepted_values: {arguments: {values: [injured, off_season, on_loan]}}
  - name: int_player_attributes_exact
    description: >
      The attributes the save states outright; for our squad the 16 entangled ones from a fresh
      entry. NULL where the save does not state it.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, tid]
            to: ref('int_player_info')
            to_columns: [snapshot_date, tid]
  - name: int_player_attribute_estimates
    description: >
      Every attribute the save does not always state, decoded from the player's own record:
      the two composites' closed forms and the fitted stg.attribute_model coefficients.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
  - name: int_player_attributes
    description: >
      Everything a player is rated on: the 23 displayed attributes (stated where the save
      states them, decoded otherwise, with one is_estimated flag), the hidden attributes,
      personality, position familiarities and feet.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, tid]
            to: ref('int_player_info')
            to_columns: [snapshot_date, tid]
  # The ratings' grain holds by construction (GROUP BY the key; ranks window over it), and
  # every rating is recomputed on read, so a whole-table test costs tens of seconds and checks
  # nothing the SQL does not already guarantee. The ratings are checked on a sample instead:
  # tests/int_player_ratings_sample.sql, int_player_rating_ranks_sample.sql.
  - name: int_player_ratings
    description: Every player rated in every role of every weight-set.
  - name: int_player_rating_ranks
    description: Each rating's percentile and rank among every player at that snapshot.
  - name: int_teams
    description: >
      Every club-shaped record on each snapshot as a team: the club that owns it (its parent, else itself), its team type and whether it is the first team.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, team_tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, club_tid]
            to: ref('int_club_snapshots')
            to_columns: [snapshot_date, club_tid]
  - name: int_club_snapshots
    description: >
      Each club on each snapshot, from its first team's record: nations, ground, colours and kits, affiliates.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, club_tid]}}
  - name: int_team_snapshots
    description: >
      Each team on each snapshot, from its own record: reputation, status, training facilities, league, last season's finish, ground (else the club's).
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, team_tid]}}
  - name: int_club_list
    description: >
      Each club once, as its latest snapshot gives it.
    data_tests:
      - unique_combination: {arguments: {columns: [club_tid]}}
  - name: int_team_list
    description: >
      Each team once, as its latest snapshot gives it.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid]}}
      - relationship_combination:
          arguments:
            columns: [club_tid]
            to: ref('int_club_list')
            to_columns: [club_tid]
  - name: int_nation_snapshots
    description: >
      Each nation on each snapshot: world ranking, the ranking and coefficient histories and the languages spoken, as lists.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, nation_id]}}
  - name: int_nations
    description: >
      Each nation once, as a place: the values that do not change between snapshots.
    data_tests:
      - unique_combination: {arguments: {columns: [nation_id]}}
  - name: int_cities
    description: >
      Each city once, as its latest snapshot gives it.
    data_tests:
      - unique_combination: {arguments: {columns: [city_id]}}
  - name: int_stadiums
    description: >
      Each stadium once: uid and city, which do not change between snapshots.
    data_tests:
      - unique_combination: {arguments: {columns: [stadium_id]}}
  - name: int_stadium_snapshots
    description: >
      Each stadium on each snapshot: name and capacity then.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, stadium_id]}}
  - name: int_world_matches
    description: >
      Every match in the world fixture list once, from the latest snapshot holding it, with the score after 90 minutes and after extra time and how it was decided.
    data_tests:
      - unique_combination: {arguments: {columns: [match_date, home_team_tid, away_team_tid]}}
      - unique_combination: {arguments: {columns: [match_id]}}
  - name: int_our_matches
    description: >
      Our own matches once each, from the latest snapshot holding them.
    data_tests:
      - unique_combination: {arguments: {columns: [match_date, home_team_tid, away_team_tid]}}
      - unique_combination: {arguments: {columns: [match_id]}}
  - name: int_stage_competitions
    description: >
      Each labelled stage's competition and how it was found (our_match, team_league).
    data_tests:
      - unique_combination: {arguments: {columns: [stage_key, competition_season]}}
  - name: int_competition_seasons
    description: >
      Each labelled competition season and the snapshot whose rules it was played under.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season]}}
  - name: int_stages
    description: >
      Each stage of each labelled competition season, from its rules.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index]}}
  - name: int_rounds
    description: >
      Each round of a knockout stage, from its rules.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index, round_index]}}
  - name: int_matches
    description: >
      Every match in the world once, placed in its competition, stage and round where known, with its tie and leg.
    data_tests:
      - unique_combination: {arguments: {columns: [match_date, home_team_tid, away_team_tid]}}
      - unique_combination: {arguments: {columns: [match_id]}}
  - name: int_team_matches
    description: >
      Every match twice, once per side.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, team_tid]}}
  - name: int_event_types
    description: >
      Every match event type, named or not, with the roles the models give it.
    data_tests:
      - unique_combination: {arguments: {columns: [code]}}
  - name: int_match_events
    description: >
      The events of our own matches once each, with period and the side each counts for.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, event_index]}}
  - name: int_player_matches
    description: >
      Each player's line in our own matches once, with minutes that count extra time and a sending-off.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, player_tid]}}
  - name: int_ties
    description: >
      Each knockout tie once: its teams, aggregate, last leg's shoot-out and winner.
    data_tests:
      - unique_combination: {arguments: {columns: [tie_id]}}
  - name: int_standings
    description: >
      Each league or group stage's table after every matchday it has played.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index, stage_key, matchday, team_tid]}}
  - name: int_participations
    description: >
      Each team in each competition season it has a labelled match in.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid, cid, competition_season]}}
  - name: int_competition_outcomes
    description: >
      How each participation ended: final position, table position, winner.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid, cid, competition_season]}}
  - name: int_competitions
    description: >
      Each competition once: the values that do not change between snapshots.
    data_tests:
      - unique_combination: {arguments: {columns: [cid]}}
  - name: int_competition_snapshots
    description: >
      Each competition on each snapshot: its reputation.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, cid]}}
  - name: int_contracts
    description: >
      Every player contract, rebuilt from the snapshots: a run of a person's snapshots whose
      current contract keeps one start date at one club, with its snapshot bounds and how it
      ended.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, first_seen_date]}}
    columns:
      - name: end_reason
        data_tests:
          - accepted_values:
              arguments: {values: [renewed, transferred, expired, released, retired]}
  - name: int_transfers
    description: >
      Every permanent move between clubs a player's career history shows, every graduation
      from a youth side, plus a move to the club on his newest snapshot the history has no
      line for yet; with the snapshot bounds of a move made while the store was watching.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, to_line_index]}}
    columns:
      - name: transfer_type
        data_tests:
          - accepted_values: {arguments: {values: [permanent, free, graduation]}}
  - name: int_loan_spells
    description: >
      Every loan the career histories and the squads show, per player, season and borrowing
      club; real dates for our own loans out.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, season, borrowing_club_tid]}}
  - name: int_staff_spells
    description: >
      Each staff member's runs of snapshots on one team's books in one role.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, first_seen_date]}}
    columns:
      - name: role
        data_tests:
          - accepted_values: {arguments: {values: [manager, staff]}}
  - name: int_squad_membership
    description: >
      Who each team's squad array lists on each snapshot, with the club his own record names.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, snapshot_date, team_tid]}}
  - name: int_team_clubs
    description: >
      The club each team tid belongs to: every recorded team, and every youth side a career
      line names (its tid the u16 complement of its club's).
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid]}}
