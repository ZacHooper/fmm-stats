[project]
name = "fm-parser-loader"
version = "0.1.0"
description = "DuckDB ETL + query CLI over fm-parser extract outputs"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    # The save's tail is a zstd-compressed archive (fmparser/core/archive.py); zstd only
    # enters the stdlib in 3.14. A dependency, not an extra: `uv run` syncs to the
    # dependency set and drops any extra a call does not name.
    "zstandard>=0.22",
]

# The extractors (extract.py, fmparser/*) need only numpy (with pandas) and zstandard;
# duckdb is imported only by load_duckdb.py / fmq.py / fmstats, dbt only by load_duckdb.py.
# Everything runs via uv.
# package = false: this is a workspace of scripts, not an installable package.
[tool.uv]
package = false
# The loader builds the stg/int models with dbt (fmstats/), so the dbt group is installed by
# default. An environment that only runs extract needs no duckdb or dbt.
default-groups = ["transform"]

[dependency-groups]
transform = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
]
