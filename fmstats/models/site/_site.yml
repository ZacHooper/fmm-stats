      - name: goals_conceded
        description: '{{ doc("goals_conceded") }}'
      - name: clear_cut_chances
        description: '{{ doc("clear_cut_chances") }}'
      - name: clear_cut_scored
        description: '{{ doc("clear_cut_scored") }}'
  - name: site_opponent_match_players
    description: Each appearance against the managed (senior) team in a match with detail.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, person_id]}}
    columns:
      - name: match_id
        description: '{{ doc("match_id") }}'
      - name: season
        description: '{{ doc("season") }}'
      - name: person_id
        description: '{{ doc("person_id") }}'
      - name: tid
        description: 'The player''s tid on the line (the web app''s player key). {{ doc("tid") }}'
      - name: team_tid
        description: '{{ doc("team_tid") }}'
      - name: opponent_tid
        description: '{{ doc("opponent_tid") }}'
      - name: match_date
        description: '{{ doc("match_date") }}'
      - name: competition
        description: 'The match table''s name for the competition. {{ doc("competition") }}'
      - name: rating
        description: '{{ doc("rating") }}'
      - name: rating_adj
        description: '{{ doc("rating_adj") }}'
      - name: goals
        description: '{{ doc("goals") }}'
      - name: assists
        description: '{{ doc("assists") }}'
      - name: minutes
