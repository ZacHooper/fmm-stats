# Unit tests: fixed input rows -> the rows a model must produce. They run inside `dbt build`
# and touch no data (dbt reads only the input tables' column types from the store).
version: 2
unit_tests:
  - name: person_names_common_then_legal
    description: >
      The common name first, else first + last; NULL when either is missing.
    model: int_person_names
    given:
      - input: ref('stg_persons')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, first_name_id: 5, last_name_id: 7, common_name_id: 0}
          - {snapshot_date: '2026-06-11', tid: 2, first_name_id: 5, last_name_id: 7, common_name_id: 4294967295}
          - {snapshot_date: '2026-06-11', tid: 3, first_name_id: 6, last_name_id: 99, common_name_id: 4294967295}
      - input: ref('stg_name_ids')
        rows:
          - {snapshot_date: '2026-06-11', name_table: first_names, id: 5, ordinal: 0}
          - {snapshot_date: '2026-06-11', name_table: surnames, id: 7, ordinal: 1}
          - {snapshot_date: '2026-06-11', name_table: nicknames, id: 0, ordinal: 2}
          - {snapshot_date: '2026-06-11', name_table: first_names, id: 6, ordinal: 3}
      - input: ref('stg_name_strings')
        rows:
          - {snapshot_date: '2026-06-11', ordinal: 0, name: Adenor}
          - {snapshot_date: '2026-06-11', ordinal: 1, name: Bachi}
          - {snapshot_date: '2026-06-11', ordinal: 2, name: Tite}
          - {snapshot_date: '2026-06-11', ordinal: 3, name: Kim}
    expect:
      rows:
        - {tid: 1, name: Tite}
        - {tid: 2, name: Adenor Bachi}
        - {tid: 3, name: null}

  - name: teams_owned_by_their_club
    description: >
      A team that names a parent belongs to it, else it owns itself and is its club's first
      team. A first-team-typed record with a parent is a b_team; a reserve-typed one a reserve;
      a national U21 side belongs to its senior side.
    model: int_teams
    given:
      - input: ref('stg_club_details')
        rows:
          - {snapshot_date: '2026-06-11', tid: 346, club_type: 0, main_club_tid: null}
          - {snapshot_date: '2026-06-11', tid: 7296, club_type: 2, main_club_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 1032, club_type: 0, main_club_tid: null}
          - {snapshot_date: '2026-06-11', tid: 6150, club_type: 0, main_club_tid: 1032}
          - {snapshot_date: '2026-06-11', tid: 20, club_type: 1, main_club_tid: null}
          - {snapshot_date: '2026-06-11', tid: 7400, club_type: 3, main_club_tid: 20}
      - input: ref('stg_clubs')
        rows:
          - {snapshot_date: '2026-06-11', tid: 346, name: Frem}
          - {snapshot_date: '2026-06-11', tid: 6150, name: Las Palmas C}
    expect:
      rows:
        - {team_tid: 346, club_tid: 346, name: Frem, team_type: first, is_first_team: true}
        - {team_tid: 7296, club_tid: 346, name: null, team_type: reserve, is_first_team: false}
        - {team_tid: 1032, club_tid: 1032, name: null, team_type: first, is_first_team: true}
        - {team_tid: 6150, club_tid: 1032, name: Las Palmas C, team_type: b_team, is_first_team: false}
        - {team_tid: 20, club_tid: 20, name: null, team_type: national, is_first_team: true}
        - {team_tid: 7400, club_tid: 20, name: null, team_type: national_u21, is_first_team: false}

  - name: team_squads_owned_by_their_club
    description: >
      Each listing carries its team's type and club (int_teams); a team with no record owns
      itself.
    model: int_team_squads
    given:
      - input: ref('stg_team_squads')
        rows:
          - {snapshot_date: '2026-06-11', team_tid: 346, player_tid: 1, slot: 0}
          - {snapshot_date: '2026-06-11', team_tid: 7296, player_tid: 2, slot: 0}
          - {snapshot_date: '2026-06-11', team_tid: 99, player_tid: 3, slot: 0}
      - input: ref('int_teams')
        rows:
          - {snapshot_date: '2026-06-11', team_tid: 346, club_tid: 346, team_type: first}
          - {snapshot_date: '2026-06-11', team_tid: 7296, club_tid: 346, team_type: reserve}
    expect:
      rows:
        - {team_tid: 346, player_tid: 1, team_type: first, club_tid: 346}
        - {team_tid: 7296, player_tid: 2, team_type: reserve, club_tid: 346}
        - {team_tid: 99, player_tid: 3, team_type: null, club_tid: 99}

  - name: team_snapshots_ground_and_youth_fall_back_to_the_club
    description: >
      A team plays at its own ground, else its club's (a reserve side stores none); a reserve
      side has its club's training and youth facilities (its record holds defaults), any other
      team its own.
    model: int_team_snapshots
    given:
      - input: ref('int_teams')
        rows:
          - {snapshot_date: '2026-06-11', team_tid: 346, club_tid: 346, team_type: first}
          - {snapshot_date: '2026-06-11', team_tid: 7296, club_tid: 346, team_type: reserve}
          - {snapshot_date: '2026-06-11', team_tid: 6150, club_tid: 1032, team_type: b_team}
      - input: ref('stg_club_details')
        rows:
          - {snapshot_date: '2026-06-11', tid: 346, stadium_id: 181, reputation: 4691, facilities: 12, academy: 14}
          - {snapshot_date: '2026-06-11', tid: 7296, stadium_id: null, reputation: 3530, facilities: 10, academy: 0}
          - {snapshot_date: '2026-06-11', tid: 1032, stadium_id: 500, reputation: 5873, facilities: 15, academy: 16}
          - {snapshot_date: '2026-06-11', tid: 6150, stadium_id: 900, reputation: 2300, facilities: 7, academy: 9}
      - input: ref('int_club_snapshots')
        rows:
          - {snapshot_date: '2026-06-11', club_tid: 346, stadium_id: 181}
          - {snapshot_date: '2026-06-11', club_tid: 1032, stadium_id: 500}
    expect:
      rows:
        - {team_tid: 346, reputation: 4691, stadium_id: 181, training_facilities: 12, youth_facilities: 14}
        - {team_tid: 7296, reputation: 3530, stadium_id: 181, training_facilities: 12, youth_facilities: 14}
        - {team_tid: 6150, reputation: 2300, stadium_id: 900, training_facilities: 7, youth_facilities: 9}

  - name: managed_squad_first_team_over_reserve
    description: >
      Our squad is every player our club's teams list, in the first team when both list him;
      another club's listing is not ours.
    model: int_managed_squad
    given:
      - input: ref('stg_career')
        rows: [{managed_club_tid: 346}]
      - input: ref('int_team_squads')
        rows:
          - {snapshot_date: '2026-06-11', team_tid: 346, player_tid: 1, team_type: first, club_tid: 346}
          - {snapshot_date: '2026-06-11', team_tid: 7296, player_tid: 1, team_type: reserve, club_tid: 346}
          - {snapshot_date: '2026-06-11', team_tid: 7296, player_tid: 2, team_type: reserve, club_tid: 346}
          - {snapshot_date: '2026-06-11', team_tid: 900, player_tid: 3, team_type: first, club_tid: 900}
    expect:
      rows:
        - {tid: 1, team_tid: 346}
        - {tid: 2, team_tid: 7296}

  - name: scrapbook_entries_latest_club_list_entry
    description: >
      Each player's entry is his latest in our club lists (the World Best XI lists are not
      ours); it is fresh while at most a year old.
    model: int_scrapbook_entries
    given:
      - input: ref('stg_scrapbook_entries')
        rows:
          - {snapshot_date: '2026-06-11', list: 31, slot: 0, player_tid: 1, entry_date: '2026-01-31', Teamwork: 6}
          - {snapshot_date: '2026-06-11', list: 32, slot: 0, player_tid: 1, entry_date: '2026-05-31', Teamwork: 7}
          - {snapshot_date: '2026-06-11', list: 0, slot: 0, player_tid: 1, entry_date: '2026-10-28', Teamwork: 19}
          - {snapshot_date: '2026-06-11', list: 31, slot: 1, player_tid: 6, entry_date: '2025-05-16', Teamwork: 12}
          - {snapshot_date: '2026-06-11', list: 0, slot: 1, player_tid: 7, entry_date: '2026-05-31', Teamwork: 15}
    expect:
      rows:
        - {player_tid: 1, entry_date: '2026-05-31', Teamwork: 7, is_fresh: true}
        - {player_tid: 6, entry_date: '2025-05-16', Teamwork: 12, is_fresh: false}

  - name: player_info_takes_our_entries
    description: >
      A squad player takes his name from his entry, and his value from it while it is fresh; a
      player outside the squad keeps his own name and has no value, even with an entry.
    model: int_player_info
    given:
      - input: ref('stg_persons')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, sid: 'aa000000', club_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 4, sid: 'dd000000', club_tid: 900}
          - {snapshot_date: '2026-06-11', tid: 6, sid: 'ff000000', club_tid: 7296}
      - input: ref('int_person_snapshots')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, person_id: 1-x}
          - {snapshot_date: '2026-06-11', tid: 4, person_id: 4-x}
          - {snapshot_date: '2026-06-11', tid: 6, person_id: 6-x}
      - input: ref('stg_player_attributes')
        rows: []
      - input: ref('int_person_names')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, name: Record One}
          - {snapshot_date: '2026-06-11', tid: 4, name: Record Four}
          - {snapshot_date: '2026-06-11', tid: 6, name: Record Six}
      - input: ref('int_managed_squad')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, team_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 6, team_tid: 7296}
      - input: ref('int_scrapbook_entries')
        rows:
          - {snapshot_date: '2026-06-11', player_tid: 1, full_name: Entry One, entry_date: '2026-05-31', value: 200, is_fresh: true}
          - {snapshot_date: '2026-06-11', player_tid: 4, full_name: Entry Four, entry_date: '2026-05-31', value: 400, is_fresh: true}
          - {snapshot_date: '2026-06-11', player_tid: 6, full_name: Entry Six, entry_date: '2025-05-16', value: 600, is_fresh: false}
      - input: ref('stg_contracts')
        rows: []
      - input: ref('stg_training')
        rows: []
    expect:
      rows:
        - {tid: 1, name: Entry One, club_tid: 346, value: 200, scrapbook_entry_date: '2026-05-31'}
        - {tid: 4, name: Record Four, club_tid: 900, value: null, scrapbook_entry_date: null}
        - {tid: 6, name: Entry Six, club_tid: 7296, value: null, scrapbook_entry_date: null}

  - name: player_info_joins_the_record_on_sid
    description: >
      A player's attribute record is the one with his sid; a player without one keeps his row
      with has_attributes false; staff (no sid) are not players; a goalkeeper is a player whose
      GK familiarity is 20.
    model: int_player_info
    given:
      - input: ref('stg_persons')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, sid: 'aa000000'}
          - {snapshot_date: '2026-06-11', tid: 2, sid: 'bb000000'}
          - {snapshot_date: '2026-06-11', tid: 3, sid: 'cc000000'}
          - {snapshot_date: '2026-06-11', tid: 4, sid: null}
      - input: ref('int_person_snapshots')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, person_id: 1-x}
          - {snapshot_date: '2026-06-11', tid: 2, person_id: 2-x}
          - {snapshot_date: '2026-06-11', tid: 3, person_id: 3-x}
          - {snapshot_date: '2026-06-11', tid: 4, person_id: 4-x}
      - input: ref('stg_player_attributes')
        rows:
          - {snapshot_date: '2026-06-11', sid: 'aa000000', pos_gk: 20, pos_dc: null, ca: 80}
          - {snapshot_date: '2026-06-11', sid: 'bb000000', pos_gk: 3, pos_dc: 20, ca: 90}
      - input: ref('int_person_names')
        rows: []
      - input: ref('int_managed_squad')
        rows: []
      - input: ref('int_scrapbook_entries')
        rows: []
      - input: ref('stg_contracts')
        rows: []
      - input: ref('stg_training')
        rows: []
    expect:
      rows:
        - {tid: 1, has_attributes: true, is_goalkeeper: true, ca: 80}
        - {tid: 2, has_attributes: true, is_goalkeeper: false, ca: 90}
        - {tid: 3, has_attributes: false, is_goalkeeper: null, ca: null}

  - name: exact_attributes_from_a_fresh_entry
    description: >
      The seven plain attributes are the player's record bytes as stored (Pace is pace_src);
      the entangled ones come from his squad entry while it is fresh, else NULL (left to the
      decode); a player without an attribute record has no row.
    model: int_player_attributes_exact
    given:
      - input: ref('stg_persons')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, sid: 'aa000000'}
          - {snapshot_date: '2026-06-11', tid: 4, sid: 'dd000000'}
          - {snapshot_date: '2026-06-11', tid: 6, sid: 'ff000000'}
          - {snapshot_date: '2026-06-11', tid: 7, sid: 'ee000000'}
      - input: ref('stg_player_attributes')
        rows:
          - {snapshot_date: '2026-06-11', sid: 'aa000000', pace_src: 11, crossing_src: 200}
          - {snapshot_date: '2026-06-11', sid: 'dd000000', pace_src: 14, crossing_src: 200}
          - {snapshot_date: '2026-06-11', sid: 'ff000000', pace_src: 16, crossing_src: 200}
      - input: ref('int_managed_squad')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, team_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 6, team_tid: 346}
      - input: ref('int_scrapbook_entries')
        rows:
          - {snapshot_date: '2026-06-11', player_tid: 1, is_fresh: true, Pace: 99, Teamwork: 7}
          - {snapshot_date: '2026-06-11', player_tid: 4, is_fresh: true, Pace: 99, Teamwork: 9}
          - {snapshot_date: '2026-06-11', player_tid: 6, is_fresh: false, Pace: 99, Teamwork: 12}
    expect:
      rows:
        - {tid: 1, Pace: 11, Teamwork: 7, Crossing: null}
        - {tid: 4, Pace: 14, Teamwork: null, Crossing: null}
        - {tid: 6, Pace: 16, Teamwork: null, Crossing: null}

  - name: attributes_estimated_unless_stated
    description: >
      A displayed attribute is the stated value where there is one, the decoded one otherwise;
      is_estimated is true when the estimable attributes are decoded. The plain attributes and
      Teamwork never make a player estimated.
    model: int_player_attributes
    given:
      - input: ref('int_player_attributes_exact')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, Pace: 11, Teamwork: 7, Aerial: 15, Crossing: 15, Dribbling: 15, Shooting: 15, Passing: 15, Tackling: 15, Creativity: 15, Decisions: 15, Movement: 15, Positioning: 15, Handling: 15, Kicking: 15, Reflexes: 15, Communication: 15, Throwing: 15}
          - {snapshot_date: '2026-06-11', tid: 2, Pace: 14, Crossing: null, Aerial: null, Teamwork: null}
      - input: ref('int_player_attribute_estimates')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, Crossing: 9, Aerial: 9, Teamwork: 9}
          - {snapshot_date: '2026-06-11', tid: 2, Crossing: 9, Aerial: 9, Teamwork: 9}
      - input: ref('stg_persons')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, sid: 'aa000000'}
          - {snapshot_date: '2026-06-11', tid: 2, sid: 'bb000000'}
      - input: ref('stg_player_attributes')
        rows:
          - {snapshot_date: '2026-06-11', sid: 'aa000000', pos_dc: 20}
          - {snapshot_date: '2026-06-11', sid: 'bb000000', pos_dc: 15}
    expect:
      rows:
        - {tid: 1, Pace: 11, Crossing: 15, Aerial: 15, Teamwork: 7, is_estimated: false, pos_dc: 20}
        - {tid: 2, Pace: 14, Crossing: 9, Aerial: 9, Teamwork: 9, is_estimated: true, pos_dc: 15}

  - name: staff_style_and_tier_banded
    description: >
      Style bands attacking_intent (<= 7 Defensive, <= 13 Normal, else Attacking) and the tier
      bands world_reputation (< 3000 Regional, < 5800 National, else Continental); a formation
      id names its catalog entry; a staff member without a staff record keeps his row.
    model: int_staff_snapshots
    given:
      - input: ref('stg_persons')
        rows:
          - {snapshot_date: '2026-06-11', tid: 10, sid: null, id2: 0}
          - {snapshot_date: '2026-06-11', tid: 11, sid: null, id2: 1}
          - {snapshot_date: '2026-06-11', tid: 12, sid: null, id2: 2}
          - {snapshot_date: '2026-06-11', tid: 13, sid: 'aa000000', id2: null}
      - input: ref('int_person_snapshots')
        rows:
          - {snapshot_date: '2026-06-11', tid: 10, person_id: 10-x}
          - {snapshot_date: '2026-06-11', tid: 11, person_id: 11-x}
          - {snapshot_date: '2026-06-11', tid: 12, person_id: 12-x}
          - {snapshot_date: '2026-06-11', tid: 13, person_id: 13-x}
      - input: ref('int_person_names')
        rows: []
      - input: ref('stg_staff_attributes')
        rows:
          - {snapshot_date: '2026-06-11', id2: 0, attacking_intent: 7, world_reputation: 2999, formation_preferred: 1, formation_attacking: 0, formation_defensive: 0}
          - {snapshot_date: '2026-06-11', id2: 1, attacking_intent: 14, world_reputation: 5800, formation_preferred: 0, formation_attacking: 0, formation_defensive: 0}
      - input: ref('stg_formations')
        rows:
          - {snapshot_date: '2026-06-11', formation_id: 0, name: 4-4-2}
          - {snapshot_date: '2026-06-11', formation_id: 1, name: 4-4-2 Diamond}
    expect:
      rows:
        - {tid: 10, has_staff_record: true, style: Defensive, reputation_tier: Regional, formation_preferred_name: 4-4-2 Diamond}
        - {tid: 11, has_staff_record: true, style: Attacking, reputation_tier: Continental, formation_preferred_name: 4-4-2}
        - {tid: 12, has_staff_record: false, style: null, reputation_tier: null, formation_preferred_name: null}

  - name: world_matches_final_score_and_decided_by
    description: >
      A match's row is the latest snapshot holding it; the final score is the score after extra
      time where there was any, and decided_by says 90, ET or pens (NULL unplayed).
    model: int_world_matches
    given:
      - input: ref('stg_world_fixtures')
        rows:
          - {snapshot_date: '2023-01-10', match_date: '2023-02-22', home_team_tid: 368, away_team_tid: 346, home_goals: null, away_goals: null, home_goals_aet: null, away_goals_aet: null, home_pens: null, away_pens: null}
          - {snapshot_date: '2023-06-26', match_date: '2023-02-22', home_team_tid: 368, away_team_tid: 346, home_goals: 0, away_goals: 0, home_goals_aet: 0, away_goals_aet: 1, home_pens: null, away_pens: null}
          - {snapshot_date: '2023-06-26', match_date: '2023-01-04', home_team_tid: 992, away_team_tid: 993, home_goals: 2, away_goals: 2, home_goals_aet: 2, away_goals_aet: 2, home_pens: 2, away_pens: 4}
          - {snapshot_date: '2023-06-26', match_date: '2023-03-01', home_team_tid: 346, away_team_tid: 344, home_goals: 1, away_goals: 0, home_goals_aet: null, away_goals_aet: null, home_pens: null, away_pens: null}
          - {snapshot_date: '2023-06-26', match_date: '2023-08-01', home_team_tid: 346, away_team_tid: 337, home_goals: null, away_goals: null, home_goals_aet: null, away_goals_aet: null, home_pens: null, away_pens: null}
    expect:
      rows:
        - {match_date: '2023-02-22', home_goals_90: 0, away_goals_90: 0, home_goals: 0, away_goals: 1, decided_by: ET, source_snapshot_date: '2023-06-26'}
        - {match_date: '2023-01-04', home_goals_90: 2, away_goals_90: 2, home_goals: 2, away_goals: 2, decided_by: pens, source_snapshot_date: '2023-06-26'}
        - {match_date: '2023-03-01', home_goals_90: 1, away_goals_90: 0, home_goals: 1, away_goals: 0, decided_by: '90', source_snapshot_date: '2023-06-26'}
        - {match_date: '2023-08-01', home_goals_90: null, away_goals_90: null, home_goals: null, away_goals: null, decided_by: null, source_snapshot_date: '2023-06-26'}

  - name: stage_competitions_from_our_match_else_one_whole_league
    description: >
      A stage takes its competition from one of our matches in it; else, when its teams are
      exactly one league's teams, that league; a cup of mixed leagues stays unlabelled, and so
      does a stage holding only part of a league.
    model: int_stage_competitions
    given:
      - input: ref('int_world_matches')
        rows:
          - {stage_key: 1, competition_season: 2025, match_date: '2025-08-01', home_team_tid: 346, away_team_tid: 344, source_snapshot_date: '2026-06-11'}
          - {stage_key: 2, competition_season: 2025, match_date: '2025-08-01', home_team_tid: 10, away_team_tid: 11, source_snapshot_date: '2026-06-11'}
          - {stage_key: 2, competition_season: 2025, match_date: '2025-08-08', home_team_tid: 12, away_team_tid: 10, source_snapshot_date: '2026-06-11'}
          - {stage_key: 3, competition_season: 2025, match_date: '2025-09-01', home_team_tid: 10, away_team_tid: 20, source_snapshot_date: '2026-06-11'}
          - {stage_key: 4, competition_season: 2025, match_date: '2025-09-02', home_team_tid: 11, away_team_tid: 12, source_snapshot_date: '2026-06-11'}
      - input: ref('int_our_matches')
        rows:
          - {match_date: '2025-08-01', home_team_tid: 346, away_team_tid: 344, cid: 2}
      - input: ref('int_team_snapshots')
        rows:
          - {snapshot_date: '2026-06-11', team_tid: 10, league_cid: 50}
          - {snapshot_date: '2026-06-11', team_tid: 11, league_cid: 50}
          - {snapshot_date: '2026-06-11', team_tid: 12, league_cid: 50}
          - {snapshot_date: '2026-06-11', team_tid: 20, league_cid: 60}
    expect:
      rows:
        - {stage_key: 1, competition_season: 2025, cid: 2, competition_source: our_match}
        - {stage_key: 2, competition_season: 2025, cid: 50, competition_source: team_league}

  - name: matches_tie_and_leg
    description: >
      A knockout match belongs to the tie of its round's pairing; in a two-legged round the legs
      are numbered by date, and a league match has neither.
