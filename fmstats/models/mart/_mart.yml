      - name: loan_club_tid
        description: '{{ doc("loan_club_tid") }}'
      - name: competition
        description: 'The competition the scrapbook profile names. {{ doc("competition") }}'
      - name: age
        description: 'As the entry stores it, which can lag a birthday by a day or two.
          {{ doc("age") }}'
      - name: appearances
        description: 'On the scrapbook entry''s date. {{ doc("appearances") }}'
      - name: goals
        description: 'On the scrapbook entry''s date. {{ doc("goals") }}'
      - name: assists
        description: 'On the scrapbook entry''s date. {{ doc("assists") }}'
      - name: average_rating
        description: 'On the scrapbook entry''s date. {{ doc("average_rating") }}'
