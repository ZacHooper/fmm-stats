version: 2
models:
  - name: int_person_names
    description: >
      Each person's name parts on each snapshot; `name` is the display name: the common name
      when he has one, else first + last.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
  - name: int_person_snapshots
    description: (snapshot_date, tid) -> person_id, the join every fact uses.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('int_persons')
            to_columns: [person_id]
  - name: int_persons
    description: >
      One row per person across every snapshot, so a retired player whose slot has gone to a
      newgen keeps his history.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id]}}
  - name: int_team_squads
    description: >
      Every team's squad listing on each snapshot, with the team's type and the club that owns
      it. A player can be listed by more than one team.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, team_tid, player_tid]}}
  - name: int_managed_squad
    description: >
      Our squad on each snapshot: every player the managed club's teams list, in the first team
      when both list him.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
  - name: int_scrapbook_entries
    description: >
      Each player's latest entry in our club's Scrapbook lists on each snapshot, with is_fresh
      for one recent enough to stand in for his record.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, player_tid]}}
  - name: int_player_snapshots
    description: >
      Each player on each snapshot: his record, the name and value our squad's entries give,
      his current contract and his training.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, tid]
            to: ref('int_person_snapshots')
            to_columns: [snapshot_date, tid]
  - name: int_player_attributes_exact
    description: >
      The attributes the save states outright; for our squad the 16 entangled ones from a fresh
      entry. NULL where the save does not state it.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, tid]
            to: ref('int_player_snapshots')
            to_columns: [snapshot_date, tid]
  - name: int_player_attribute_estimates
    description: >
      Every attribute the save does not always state, decoded from the player's own record:
      the two composites' closed forms and the fitted stg.attribute_model coefficients.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
  - name: int_player_attributes
    description: >
      All 23 attributes, with an `_est` flag each: stated where the save states them, the
      decode from int.player_attribute_estimates otherwise.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, tid]
            to: ref('int_player_snapshots')
            to_columns: [snapshot_date, tid]
  # The ratings' grain holds by construction (GROUP BY the key; ranks window over it), and
  # every rating is recomputed on read, so a whole-table test costs tens of seconds and checks
  # nothing the SQL does not already guarantee. The ratings are checked on a sample instead:
  # tests/int_player_ratings_sample.sql, int_player_rating_ranks_sample.sql.
  - name: int_player_ratings
    description: Every player rated in every role of every weight-set.
  - name: int_player_rating_ranks
    description: Each rating's percentile and rank among every player at that snapshot.
