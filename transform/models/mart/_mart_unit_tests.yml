# Unit tests for the mart's own rules (see models/int/_int_unit_tests.yml).
version: 2
unit_tests:
  - name: injury_spells_split_on_gap
    description: >
      Injured weeks up to var('injury_spell_gap_days') apart are one spell; a longer gap starts
      a new one. Weeks without the injured flag do not count.
    model: fact_injury_spell
    given:
      - input: ref('int_progress_weeks')
        rows:
          - {person_id: 7-2001-01-01, week_date: '2026-01-05', is_injured: true}
          - {person_id: 7-2001-01-01, week_date: '2026-01-12', is_injured: true}
          - {person_id: 7-2001-01-01, week_date: '2026-01-19', is_injured: false}
          - {person_id: 7-2001-01-01, week_date: '2026-01-26', is_injured: true}
    expect:
      rows:
        - {person_id: 7-2001-01-01, start_date: '2026-01-05', end_date: '2026-01-12', weeks: 2}
        - {person_id: 7-2001-01-01, start_date: '2026-01-26', end_date: '2026-01-26', weeks: 1}

  - name: player_award_resolves_recycled_tid_by_name
    description: >
      An entry names the person who held its tid under its name, not whoever holds the tid
      now. A season's pool is the latest snapshot's; an in-progress list takes the snapshot's
      season and is not final; an All-Time entry takes the season of the entry it copies.
    model: fact_player_award
    given:
      - input: ref('stg_snapshots')
        rows:
          - {snapshot_date: '2023-06-29', season: 2023}
          - {snapshot_date: '2027-08-09', season: 2028}
      - input: ref('stg_scrapbook_entries')
        rows:
          - {snapshot_date: '2027-08-09', list: 0, list_season: 2022, player_tid: 5, entry_date: '2022-03-01', full_name: Robert Lewandowski}
          - {snapshot_date: '2027-08-09', list: 1, list_season: 65535, player_tid: 6, entry_date: '2027-08-01', full_name: Kim Lund}
          - {snapshot_date: '2027-08-09', list: 62, list_season: 65535, player_tid: 5, entry_date: '2022-03-01', full_name: Robert Lewandowski}
      - input: ref('int_person_snapshots')
        rows:
          - {snapshot_date: '2023-06-29', tid: 5, person_id: 5-1988-08-21}
          - {snapshot_date: '2027-08-09', tid: 5, person_id: 5-2010-02-02}
          - {snapshot_date: '2027-08-09', tid: 6, person_id: 6-2005-05-05}
      - input: ref('int_person_names')
        rows:
          - {snapshot_date: '2023-06-29', tid: 5, name: Robert Lewandowski}
          - {snapshot_date: '2027-08-09', tid: 5, name: Fabio Voeste}
          - {snapshot_date: '2027-08-09', tid: 6, name: Kim Lund}
    expect:
      rows:
        - {award_id: world_best_xi, season: 2022, player_tid: 5, person_id: 5-1988-08-21, is_final: true}
        - {award_id: world_best_xi, season: 2028, player_tid: 6, person_id: 6-2005-05-05, is_final: false}
        - {award_id: world_best_xi_all_time, season: 2022, player_tid: 5, person_id: 5-1988-08-21, is_final: true}
