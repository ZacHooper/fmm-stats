# Unit tests: fixed input rows -> the rows a model must produce. They run inside `dbt build`
# and touch no data (dbt reads only the input tables' column types from the store).
version: 2
unit_tests:
  - name: person_names_common_then_legal
    description: >
      The common name first, else first + last; NULL when either is missing.
    model: int_person_names
    given:
      - input: ref('stg_persons')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, first_name_id: 5, last_name_id: 7, common_name_id: 0}
          - {snapshot_date: '2026-06-11', tid: 2, first_name_id: 5, last_name_id: 7, common_name_id: 4294967295}
          - {snapshot_date: '2026-06-11', tid: 3, first_name_id: 6, last_name_id: 99, common_name_id: 4294967295}
      - input: ref('stg_name_ids')
        rows:
          - {snapshot_date: '2026-06-11', name_table: first_names, id: 5, ordinal: 0}
          - {snapshot_date: '2026-06-11', name_table: surnames, id: 7, ordinal: 1}
          - {snapshot_date: '2026-06-11', name_table: nicknames, id: 0, ordinal: 2}
          - {snapshot_date: '2026-06-11', name_table: first_names, id: 6, ordinal: 3}
      - input: ref('stg_name_strings')
        rows:
          - {snapshot_date: '2026-06-11', ordinal: 0, name: Adenor}
          - {snapshot_date: '2026-06-11', ordinal: 1, name: Bachi}
          - {snapshot_date: '2026-06-11', ordinal: 2, name: Tite}
          - {snapshot_date: '2026-06-11', ordinal: 3, name: Kim}
    expect:
      rows:
        - {tid: 1, name: Tite}
        - {tid: 2, name: Adenor Bachi}
        - {tid: 3, name: null}

  - name: team_squads_owned_by_their_club
    description: >
      A reserve side is owned by the first team its record names; a first team or a national
      side owns itself; the team type is named from the club type.
    model: int_team_squads
    given:
      - input: ref('stg_team_squads')
        rows:
          - {snapshot_date: '2026-06-11', team_tid: 346, player_tid: 1, slot: 0}
          - {snapshot_date: '2026-06-11', team_tid: 7296, player_tid: 2, slot: 0}
          - {snapshot_date: '2026-06-11', team_tid: 20, player_tid: 1, slot: 4}
      - input: ref('stg_club_details')
        rows:
          - {snapshot_date: '2026-06-11', tid: 346, club_type: 0, main_club_tid: null}
          - {snapshot_date: '2026-06-11', tid: 7296, club_type: 2, main_club_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 20, club_type: 1, main_club_tid: null}
    expect:
      rows:
        - {team_tid: 346, player_tid: 1, team_type: first, club_tid: 346}
        - {team_tid: 7296, player_tid: 2, team_type: reserve, club_tid: 346}
        - {team_tid: 20, player_tid: 1, team_type: national, club_tid: 20}

  - name: managed_squad_first_team_over_reserve
    description: >
      Our squad is every player our club's teams list, in the first team when both list him;
      another club's listing is not ours.
    model: int_managed_squad
    given:
      - input: ref('stg_career')
        rows: [{managed_club_tid: 346}]
      - input: ref('int_team_squads')
        rows:
          - {snapshot_date: '2026-06-11', team_tid: 346, player_tid: 1, team_type: first, club_tid: 346}
          - {snapshot_date: '2026-06-11', team_tid: 7296, player_tid: 1, team_type: reserve, club_tid: 346}
          - {snapshot_date: '2026-06-11', team_tid: 7296, player_tid: 2, team_type: reserve, club_tid: 346}
          - {snapshot_date: '2026-06-11', team_tid: 900, player_tid: 3, team_type: first, club_tid: 900}
    expect:
      rows:
        - {tid: 1, team_tid: 346}
        - {tid: 2, team_tid: 7296}

  - name: scrapbook_entries_latest_club_list_entry
    description: >
      Each player's entry is his latest in our club lists (the World Best XI lists are not
      ours); it is fresh while at most a year old.
    model: int_scrapbook_entries
    given:
      - input: ref('stg_scrapbook_entries')
        rows:
          - {snapshot_date: '2026-06-11', list: 31, slot: 0, player_tid: 1, entry_date: '2026-01-31', Teamwork: 6}
          - {snapshot_date: '2026-06-11', list: 32, slot: 0, player_tid: 1, entry_date: '2026-05-31', Teamwork: 7}
          - {snapshot_date: '2026-06-11', list: 0, slot: 0, player_tid: 1, entry_date: '2026-10-28', Teamwork: 19}
          - {snapshot_date: '2026-06-11', list: 31, slot: 1, player_tid: 6, entry_date: '2025-05-16', Teamwork: 12}
          - {snapshot_date: '2026-06-11', list: 0, slot: 1, player_tid: 7, entry_date: '2026-05-31', Teamwork: 15}
    expect:
      rows:
        - {player_tid: 1, entry_date: '2026-05-31', Teamwork: 7, is_fresh: true}
        - {player_tid: 6, entry_date: '2025-05-16', Teamwork: 12, is_fresh: false}

  - name: player_snapshots_take_our_entries
    description: >
      A squad player takes his name from his entry, and his value from it while it is fresh; a
      player outside the squad keeps his own name and has no value, even with an entry; staff
      are not players.
    model: int_player_snapshots
    given:
      - input: ref('stg_persons')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, is_staff: false, club_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 4, is_staff: false, club_tid: 900}
          - {snapshot_date: '2026-06-11', tid: 6, is_staff: false, club_tid: 7296}
          - {snapshot_date: '2026-06-11', tid: 8, is_staff: true, club_tid: 346}
      - input: ref('int_person_snapshots')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, person_id: 1-x}
          - {snapshot_date: '2026-06-11', tid: 4, person_id: 4-x}
          - {snapshot_date: '2026-06-11', tid: 6, person_id: 6-x}
          - {snapshot_date: '2026-06-11', tid: 8, person_id: 8-x}
      - input: ref('int_person_names')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, name: Record One}
          - {snapshot_date: '2026-06-11', tid: 4, name: Record Four}
          - {snapshot_date: '2026-06-11', tid: 6, name: Record Six}
      - input: ref('int_managed_squad')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, team_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 6, team_tid: 7296}
      - input: ref('int_scrapbook_entries')
        rows:
          - {snapshot_date: '2026-06-11', player_tid: 1, full_name: Entry One, entry_date: '2026-05-31', value: 200, is_fresh: true}
          - {snapshot_date: '2026-06-11', player_tid: 4, full_name: Entry Four, entry_date: '2026-05-31', value: 400, is_fresh: true}
          - {snapshot_date: '2026-06-11', player_tid: 6, full_name: Entry Six, entry_date: '2025-05-16', value: 600, is_fresh: false}
      - input: ref('stg_contracts')
        rows: []
      - input: ref('stg_training')
        rows: []
    expect:
      rows:
        - {tid: 1, name: Entry One, club_tid: 346, value: 200, scrapbook_entry_date: '2026-05-31'}
        - {tid: 4, name: Record Four, club_tid: 900, value: null, scrapbook_entry_date: null}
        - {tid: 6, name: Entry Six, club_tid: 7296, value: null, scrapbook_entry_date: null}

  - name: exact_attributes_from_a_fresh_entry
    description: >
      The seven plain attributes always come from the player's own record; the entangled ones
      from his squad entry while it is fresh, else as stated (NULL, left to the decode).
    model: int_player_attributes_exact
    given:
      - input: ref('stg_player_attributes_stated')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, Pace: 11}
          - {snapshot_date: '2026-06-11', tid: 4, Pace: 14}
          - {snapshot_date: '2026-06-11', tid: 6, Pace: 16}
      - input: ref('int_managed_squad')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, team_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 6, team_tid: 346}
      - input: ref('int_scrapbook_entries')
        rows:
          - {snapshot_date: '2026-06-11', player_tid: 1, is_fresh: true, Pace: 99, Teamwork: 7}
          - {snapshot_date: '2026-06-11', player_tid: 4, is_fresh: true, Pace: 99, Teamwork: 9}
          - {snapshot_date: '2026-06-11', player_tid: 6, is_fresh: false, Pace: 99, Teamwork: 12}
    expect:
      rows:
        - {tid: 1, Pace: 11, Teamwork: 7}
        - {tid: 4, Pace: 14, Teamwork: null}
        - {tid: 6, Pace: 16, Teamwork: null}
