  - name: matches_tie_and_leg
    description: >
      A knockout match belongs to the tie of its round's pairing; in a two-legged round the legs
      are numbered by date, and a league match has neither.
    model: int_matches
    given:
      - input: ref('int_world_matches')
        rows:
          - {match_date: '2025-03-01', home_team_tid: 1, away_team_tid: 2, competition_season: 2024, stage_key: 7, stage_index: 1, round_index: 0}
          - {match_date: '2025-03-08', home_team_tid: 2, away_team_tid: 1, competition_season: 2024, stage_key: 7, stage_index: 1, round_index: 0}
          - {match_date: '2025-03-02', home_team_tid: 3, away_team_tid: 4, competition_season: 2024, stage_key: 8, stage_index: 0, round_index: null}
      - input: ref('int_stage_competitions')
        rows:
          - {stage_key: 7, competition_season: 2024, cid: 900, competition_source: our_match}
          - {stage_key: 8, competition_season: 2024, cid: 2, competition_source: team_league}
      - input: ref('int_stages')
        rows:
          - {cid: 900, competition_season: 2024, stage_index: 1, stage_format: knockout}
          - {cid: 2, competition_season: 2024, stage_index: 0, stage_format: league}
      - input: ref('int_rounds')
        rows:
          - {cid: 900, competition_season: 2024, stage_index: 1, round_index: 0, legs: 2}
      - input: ref('int_our_matches')
        rows: []
    expect:
      rows:
        - {match_date: '2025-03-01', cid: 900, tie_id: 900-2024-1-0-1-2, leg: 1}
        - {match_date: '2025-03-08', cid: 900, tie_id: 900-2024-1-0-1-2, leg: 2}
        - {match_date: '2025-03-02', cid: 2, tie_id: null, leg: null}
  - name: player_matches_minutes_count_extra_time
    description: >
      A player's minutes run to the end of the match, 120 when it went to extra time: a starter
      plays 120, a substitute on at 105 plays 15, a starter sent off at 60 plays 60, and an
      unused substitute none. In a 90-minute match a starter taken off at 70 plays 70.
    model: int_player_matches
    given:
      - input: ref('int_our_matches')
        rows:
          - {match_id: 1, match_date: '2025-03-01', home_team_tid: 1, away_team_tid: 2, anchor: 10, source_snapshot_date: '2025-06-01'}
          - {match_id: 2, match_date: '2025-03-08', home_team_tid: 1, away_team_tid: 3, anchor: 11, source_snapshot_date: '2025-06-01'}
      - input: ref('stg_match_player_stats')
        rows:
          - {snapshot_date: '2025-06-01', anchor: 10, player_tid: 100, team_tid: 1, pos_order: 1, sub_on_minute: null, sub_off_minute: null}
          - {snapshot_date: '2025-06-01', anchor: 10, player_tid: 101, team_tid: 1, pos_order: 14, sub_on_minute: 105, sub_off_minute: null}
          - {snapshot_date: '2025-06-01', anchor: 10, player_tid: 102, team_tid: 2, pos_order: 4, sub_on_minute: null, sub_off_minute: null}
          - {snapshot_date: '2025-06-01', anchor: 10, player_tid: 103, team_tid: 2, pos_order: 16, sub_on_minute: null, sub_off_minute: null}
          - {snapshot_date: '2025-06-01', anchor: 11, player_tid: 100, team_tid: 1, pos_order: 1, sub_on_minute: null, sub_off_minute: 70}
      - input: ref('int_match_events')
        rows:
          - {match_id: 1, player_tid: 102, minute: 60, event_type_code: 5}
      - input: ref('int_event_types')
        rows:
          - {code: 5, ends_appearance: true}
      - input: ref('int_matches')
        rows:
          - {match_id: 1, decided_by: ET}
          - {match_id: 2, decided_by: '90'}
      - input: ref('int_person_snapshots')
        rows: []
    expect:
      rows:
        - {match_id: 1, player_tid: 100, started: true, appeared: true, minutes: 120}
        - {match_id: 1, player_tid: 101, started: false, appeared: true, minutes: 15}
        - {match_id: 1, player_tid: 102, started: true, appeared: true, minutes: 60}
        - {match_id: 1, player_tid: 103, started: false, appeared: false, minutes: 0}
        - {match_id: 2, player_tid: 100, started: true, appeared: true, minutes: 70}
  - name: match_events_period_and_credited_side
    description: >
      An event's period is the one its minute falls in, stoppage time staying in the period it
      extends, and a shoot-out kick is its own period; an own goal counts for the other side.
    model: int_match_events
    given:
      - input: ref('int_our_matches')
        rows:
          - {match_id: 1, match_date: '2025-03-01', home_team_tid: 1, away_team_tid: 2, anchor: 10, source_snapshot_date: '2025-06-01'}
      - input: ref('stg_match_events')
        rows:
          - {snapshot_date: '2025-06-01', anchor: 10, seq: 0, minute: 45, added: 2, side: home, player_tid: 100, type_byte: 1}
          - {snapshot_date: '2025-06-01', anchor: 10, seq: 1, minute: 46, added: 0, side: home, player_tid: 100, type_byte: 2}
          - {snapshot_date: '2025-06-01', anchor: 10, seq: 2, minute: 105, added: 1, side: away, player_tid: 200, type_byte: 1}
          - {snapshot_date: '2025-06-01', anchor: 10, seq: 3, minute: 120, added: 2, side: away, player_tid: 200, type_byte: 7}
      - input: ref('int_event_types')
        rows:
          - {code: 1, is_shootout: false, scores_for: for}
          - {code: 2, is_shootout: false, scores_for: against}
          - {code: 7, is_shootout: true, scores_for: null}
      - input: ref('int_person_snapshots')
        rows: []
    expect:
      rows:
        - {event_index: 0, period: first_half, player_team_tid: 1, team_tid: 1}
        - {event_index: 1, period: second_half, player_team_tid: 1, team_tid: 2}
        - {event_index: 2, period: extra_time_first_half, player_team_tid: 2, team_tid: 2}
        - {event_index: 3, period: shootout, player_team_tid: 2, team_tid: 2}
  - name: ties_aggregate_then_shootout
    description: >
      A tie is won on aggregate, then on the last leg's shoot-out, with no away-goals rule; it is
      undecided until all its legs are played.
