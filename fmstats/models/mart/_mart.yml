  - name: fact_player_award
    description: >
      Each player's place in a World Best XI pool, with the scrapbook entry that earned it.
      person_id is NULL for a past winner no snapshot in the store still holds (a short
      history: he left the game's database before the first save), so the row is keyed on
      player_tid, and on person_id where it is known.
    data_tests:
      # warn, not error: a player whose date of birth reads differently across snapshots
      # gets two person_ids and so two rows (TODO "Person identity across snapshots")
      - unique_combination:
          arguments: {columns: [award_id, player_tid, entry_date]}
          config: {severity: warn}
      - unique_combination:
          arguments: {columns: [award_id, person_id, entry_date]}
          config: {where: "person_id is not null"}
      - relationship_combination:
          arguments:
            columns: [award_id]
            to: ref('dim_award')
            to_columns: [award_id]
      - relationship_combination:
          arguments:
            columns: [person_id]
            to: ref('dim_person')
            to_columns: [person_id]
    columns:
      - name: award_id
        description: '{{ doc("award_id") }}'
      - name: season
        description: 'The season the pool is for; NULL on an All-Time entry no season list holds.
          {{ doc("season") }}'
      - name: person_id
        description: 'The person with the entry''s tid whose date of birth gives the entry''s age on
          its date; NULL for a past winner no snapshot holds. {{ doc("person_id") }}'
      - name: player_tid
        description: 'The player the entry was written for. {{ doc("tid") }}'
      - name: entry_name
        description: '{{ doc("entry_name") }}'
