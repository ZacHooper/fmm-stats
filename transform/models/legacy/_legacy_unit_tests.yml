version: 2
unit_tests:
  - name: legacy_players_list_a_loanee_under_us
    description: >
      A player in our squad whose record names a club outside ours is loaned_in, listed under
      the team that lists him with his own club as parent; one owned by our reserve side is
      not; a free agent keeps the parser's 0xFFFF and 'Free agent'.
    model: legacy_players
    given:
      - input: ref('int_player_records')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, club_tid: 7296}
          - {snapshot_date: '2026-06-11', tid: 2, club_tid: 900}
          - {snapshot_date: '2026-06-11', tid: 3, club_tid: null}
      - input: ref('stg_person_records')
        rows: []
      - input: ref('int_managed_squad')
        rows:
          - {snapshot_date: '2026-06-11', tid: 1, team_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 2, team_tid: 346}
      - input: ref('stg_club_details')
        rows:
          - {snapshot_date: '2026-06-11', tid: 7296, main_club_tid: 346}
          - {snapshot_date: '2026-06-11', tid: 900, main_club_tid: null}
      - input: ref('stg_career')
        rows: [{managed_club_tid: 346}]
      - input: ref('stg_snapshots')
        rows: [{snapshot_date: '2026-06-11', season: 2026}]
      - input: ref('int_player_snapshots')
        rows: []
      - input: ref('int_person_names')
        rows: []
      - input: ref('stg_clubs')
        rows:
          - {snapshot_date: '2026-06-11', tid: 346, name: Frem}
          - {snapshot_date: '2026-06-11', tid: 7296, name: Frem Reserves}
          - {snapshot_date: '2026-06-11', tid: 900, name: Other}
      - input: ref('stg_training')
        rows: []
    expect:
      rows:
        - {tid: 1, club_tid: 7296, club: Frem Reserves, loaned_in: false, parent_club_tid: null, parent_club: null}
        - {tid: 2, club_tid: 346, club: Frem, loaned_in: true, parent_club_tid: 900, parent_club: Other}
        - {tid: 3, club_tid: 65535, club: Free agent, loaned_in: false, parent_club_tid: null, parent_club: null}
