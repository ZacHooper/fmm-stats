        - {matchday: 2, through_date: '2025-03-08', team_tid: 1, position: 1, played: 1, points: 3, goal_difference: 2}
        - {matchday: 2, through_date: '2025-03-08', team_tid: 2, position: 2, played: 2, points: 3, goal_difference: 1}
        - {matchday: 2, through_date: '2025-03-08', team_tid: 3, position: 3, played: 1, points: 0, goal_difference: -3}

