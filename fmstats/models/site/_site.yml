    description: Our squad on each snapshot.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, person_id]}}
      - relationship_combination:
          arguments:
            columns: [snapshot_date, person_id]
            to: ref('fact_player_snapshot')
            to_columns: [snapshot_date, person_id]
    columns:
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: person_id
        description: '{{ doc("person_id") }}'
      - name: status
        description: '{{ doc("squad_status") }}'
      - name: is_loan_in
        description: '{{ doc("is_loan_in") }}'
      - name: loaned_to_club_tid
        description: '{{ doc("loaned_to_club_tid") }}'
  - name: site_player_spells
    description: Where each player was, as dated spells.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, spell_type, from_date]}}
    columns:
      - name: person_id
        description: '{{ doc("person_id") }}'
      - name: spell_type
        description: '{{ doc("spell_type") }}'
      - name: club_tid
        description: 'The team of an at_club spell (first team and reserves are two), the borrowing
          club of a loan out, the parent club of a loan in; NULL for an injury.
          {{ doc("team_tid") }}'
      - name: from_date
        description: '{{ doc("from_date") }}'
      - name: to_date
        description: '{{ doc("to_date") }}'
  - name: site_player_moves
    description: The dated moves the development chart marks.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, move_type, move_date]}}
    columns:
      - name: person_id
        description: '{{ doc("person_id") }}'
      - name: move_date
        description: '{{ doc("move_date") }}'
      - name: from_club_tid
        description: 'The club he left, or for an internal move our team he left; NULL for a free
          agent''s signing. {{ doc("from_club_tid") }}'
      - name: to_club_tid
        description: 'The club he joined, or for an internal move our team he joined.
          {{ doc("to_club_tid") }}'
      - name: move_type
        description: '{{ doc("move_type") }}'
      - name: fee_type
        description: '{{ doc("move_fee_type") }}'
      - name: fee_gbp
        description: '{{ doc("fee_gbp") }}'
  - name: site_player_career
    description: Each player's career history, one row per line.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, line_index]}}
    columns:
      - name: person_id
        description: '{{ doc("person_id") }}'
      - name: line_index
        description: '{{ doc("line_index") }}'
      - name: season
        description: '{{ doc("season") }}'
      - name: team_tid
        description: 'The team the line names; NULL on a line with no club. {{ doc("team_tid") }}'
      - name: club
        description: '{{ doc("club") }}'
      - name: fee_kind
        description: '{{ doc("fee_type") }}'
      - name: fee_gbp
        description: '{{ doc("fee_gbp") }}'
      - name: fee_label
        description: '{{ doc("fee_label") }}'
      - name: apps
        description: '{{ doc("appearances") }}'
      - name: goals
        description: 'Goals CONCEDED on a goalkeeper''s line. {{ doc("goals") }}'
      - name: assists
        description: '{{ doc("assists") }}'
      - name: rating
        description: 'The game''s average rating for the season (see fact_player_season.rating).
          {{ doc("average_rating") }}'
  - name: site_player_honours
    description: >
      Each player's honours: every award place (1st to 3rd) and team-of-the-period pick the
      store has seen, with the period it is for and his club then. Manager awards left out.
    data_tests:
      - unique_combination: {arguments: {columns: [person_id, award_id, edition_date]}}
    columns:
      - name: person_id
        description: '{{ doc("person_id") }}'
      - name: award_id
        description: '{{ doc("award_id") }}'
      - name: award_name
        description: 'The award''s name in full. {{ doc("name") }}'
      - name: short_name
        description: '{{ doc("short_name") }}'
      - name: award_scope
        description: '{{ doc("award_scope") }}'
      - name: award_type
        description: '{{ doc("award_type") }}'
      - name: award_period
        description: '{{ doc("award_period") }}'
      - name: season
        description: 'An annual award''s edition year; the career season of the edition''s date
          on a weekly or monthly award. {{ doc("season") }}'
      - name: edition_date
        description: '{{ doc("edition_date") }}'
      - name: period_label
        description: '{{ doc("period_label") }}'
      - name: place
        description: 'NULL on a team-of-the-period pick. {{ doc("place") }}'
      - name: club_tid
        description: 'His club when he was picked; NULL for none. {{ doc("club_tid") }}'
      - name: club
        description: '{{ doc("club") }}'
      - name: score
        description: 'NULL on a team pick. {{ doc("score") }}'
      - name: selection_rating
        description: 'NULL on an award place. {{ doc("selection_rating") }}'
