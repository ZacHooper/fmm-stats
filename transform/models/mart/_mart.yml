version: 2
models:
  - name: mart_dim_position
    description: >
      The fifteen positions: code, unit, display order.
    data_tests:
      - unique_combination: {arguments: {columns: [position]}}
  - name: mart_dim_role
    description: >
      The player roles by id; a role names no position.
    data_tests:
      - unique_combination: {arguments: {columns: [role_id]}}
  - name: mart_dim_city
    description: >
      Each city, as its latest snapshot gives it.
    data_tests:
      - unique_combination: {arguments: {columns: [city_id]}}
  - name: mart_dim_stadium
    description: >
      Each stadium, as its latest snapshot gives it.
    data_tests:
      - unique_combination: {arguments: {columns: [stadium_id]}}
  - name: mart_dim_nation
    description: >
      Each nation as a place, with the languages it speaks.
    data_tests:
      - unique_combination: {arguments: {columns: [nation_id]}}
  - name: mart_fact_nation_snapshot
    description: >
      Each nation on each snapshot: ranking and the two histories.
    data_tests:
      - unique_combination: {arguments: {columns: [nation_id, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [nation_id]
            to: ref('mart_dim_nation')
            to_columns: [nation_id]
  - name: mart_dim_club
    description: >
      Each club: its first team's name and nations.
    data_tests:
      - unique_combination: {arguments: {columns: [club_tid]}}
  - name: mart_dim_team
    description: >
      Each team, the side that plays, with the club that owns it and its team type.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid]}}
      - relationship_combination:
          arguments:
            columns: [club_tid]
            to: ref('mart_dim_club')
            to_columns: [club_tid]
  - name: mart_fact_club_snapshot
    description: >
      Each club on each snapshot: what its teams share.
    data_tests:
      - unique_combination: {arguments: {columns: [club_tid, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [club_tid]
            to: ref('mart_dim_club')
            to_columns: [club_tid]
      - relationship_combination:
          arguments:
            columns: [stadium_id]
            to: ref('mart_dim_stadium')
            to_columns: [stadium_id]
  - name: mart_fact_team_snapshot
    description: >
      Each team on each snapshot: what each side holds on its own.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [team_tid]
            to: ref('mart_dim_team')
            to_columns: [team_tid]
      - relationship_combination:
          arguments:
            columns: [stadium_id]
            to: ref('mart_dim_stadium')
            to_columns: [stadium_id]
