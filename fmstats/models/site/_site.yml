version: 2
# The web app's marts (data-layers step 17), read by scripts/export_site.py only. Each states
# its grain; docs/plans/2026-10-03-site-marts.md has the design and the differences from the
# old export.
models:
  - name: site_snapshots
    description: The store's snapshots, the newest flagged.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date]}}
    columns:
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: season
        description: 'The snapshot''s season. {{ doc("season") }}'
      - name: label
        description: '{{ doc("label") }}'
      - name: save_format
        description: '{{ doc("save_format") }}'
      - name: is_latest
        description: '{{ doc("is_latest") }}'
  - name: site_config
    description: The settings the web app reads, one row per key.
    data_tests:
      - unique_combination: {arguments: {columns: [key]}}
    columns:
      - name: key
        description: '{{ doc("key") }}'
      - name: value
        description: '{{ doc("value") }}'
  - name: site_role_weights
    description: Each weight-set's attribute weights per role.
    data_tests:
      - unique_combination: {arguments: {columns: [method, role, attribute]}}
    columns:
      - name: method
        description: '{{ doc("method") }}'
      - name: role
        description: '{{ doc("role") }}'
      - name: attribute
        description: '{{ doc("attribute") }}'
      - name: weight
        description: '{{ doc("weight") }}'
  - name: site_position_roles
    description: The role each position is rated in.
    data_tests:
      - unique_combination: {arguments: {columns: [position]}}
    columns:
      - name: position
        description: '{{ doc("position") }}'
      - name: role
        description: '{{ doc("role") }}'
  - name: site_our_teams
    description: The teams of the club we manage.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid]}}
    columns:
      - name: team_tid
        description: '{{ doc("team_tid") }}'
      - name: club_tid
        description: '{{ doc("club_tid") }}'
      - name: name
        description: 'The team''s name. {{ doc("name") }}'
      - name: is_first_team
        description: '{{ doc("is_first_team") }}'
      - name: is_managed
        description: '{{ doc("is_managed") }}'
  - name: site_clubs
    description: Every team on every snapshot, with its league and whether it is listed.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, team_tid]}}
    columns:
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: team_tid
        description: '{{ doc("team_tid") }}'
      - name: club_tid
        description: '{{ doc("club_tid") }}'
      - name: name
        description: 'The team''s name. {{ doc("name") }}'
      - name: team_type
        description: '{{ doc("team_type") }}'
      - name: league_cid
        description: '{{ doc("league_cid") }}'
      - name: league_name
        description: 'The name of the team''s league. {{ doc("name") }}'
      - name: nation
        description: '{{ doc("nation") }}'
      - name: reputation
        description: 'The team''s, 1-10,000. {{ doc("reputation") }}'
      - name: shirt_colours
        description: '{{ doc("shirt_colours") }}'
      - name: squad_size
        description: '{{ doc("n_players") }}'
      - name: is_listed
        description: '{{ doc("is_listed") }}'
  - name: site_leagues
    description: Every league on every snapshot, with skill_idx, our pyramid and the comparison ladder.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, cid]}}
      - unique_combination: {arguments: {columns: [snapshot_date, ladder_rank]},
                             config: {where: "ladder_rank is not null"}}
      - unique_combination: {arguments: {columns: [snapshot_date, pyramid_rank]},
                             config: {where: "pyramid_rank is not null"}}
    columns:
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: cid
        description: 'The league. {{ doc("cid") }}'
      - name: name
        description: 'The league''s name. {{ doc("name") }}'
      - name: short_name
        description: '{{ doc("short_name") }}'
      - name: nation
        description: '{{ doc("nation") }}'
      - name: type
        description: '{{ doc("type") }}'
      - name: reputation
        description: 'The league''s, 0-200. {{ doc("reputation") }}'
      - name: tier
        description: '{{ doc("tier") }}'
      - name: member_count
        description: '{{ doc("n_members") }}'
      - name: skill_idx
        description: '{{ doc("skill_index") }}'
      - name: rated
        description: '{{ doc("n_rated") }}'
      - name: pyramid_rank
        description: '{{ doc("pyramid_rank") }}'
      - name: pyramid_level
        description: '{{ doc("pyramid_level") }}'
      - name: ladder_rank
        description: '{{ doc("ladder_rank") }}'
  - name: site_players
    description: Every rated player on every snapshot, with positions and Level %iles.
    data_tests:
      - unique_combination: {arguments: {columns: [snapshot_date, person_id]}}
      - unique_combination: {arguments: {columns: [snapshot_date, tid]}}
