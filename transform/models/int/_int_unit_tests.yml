      - input: ref('int_team_matches')
        rows:
          - {match_id: 1, team_tid: 1, goals_for: 2, goals_against: 0, result: W, points: 3}
          - {match_id: 1, team_tid: 2, goals_for: 0, goals_against: 2, result: L, points: 0}
          - {match_id: 2, team_tid: 2, goals_for: 3, goals_against: 0, result: W, points: 3}
          - {match_id: 2, team_tid: 3, goals_for: 0, goals_against: 3, result: L, points: 0}
