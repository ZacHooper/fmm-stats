# Unit tests for the mart's own rules (see models/int/_int_unit_tests.yml).
version: 2
unit_tests:
  - name: player_award_resolves_recycled_tid_by_age
    description: >
      An entry names the person who held its tid when it was written: the one whose date of
      birth gives the entry's age on its date (or one less, a birthday a day or two before),
      not the newgen holding the tid now. A season's pool is the latest snapshot's; an
      in-progress list takes the snapshot's season and is not final; an All-Time entry takes
      the season of the entry it copies.
    model: fact_player_award
    given:
      - input: ref('stg_snapshots')
        rows:
          - {snapshot_date: '2023-06-29', season: 2023}
          - {snapshot_date: '2027-08-09', season: 2028}
      - input: ref('stg_scrapbook_entries')
        rows:
          - {snapshot_date: '2027-08-09', list: 0, list_season: 2022, player_tid: 5, entry_date: '2022-03-01', age: 33, full_name: Robert Lewandowski}
          - {snapshot_date: '2027-08-09', list: 1, list_season: 65535, player_tid: 6, entry_date: '2027-05-01', age: 30, full_name: Marc-André ter Stegen}
          - {snapshot_date: '2027-08-09', list: 62, list_season: 65535, player_tid: 5, entry_date: '2022-03-01', age: 33, full_name: Robert Lewandowski}
      - input: ref('int_persons')
        rows:
          - {person_id: 5-1988-08-21, tid: 5, dob: '1988-08-21'}
          - {person_id: 5-2010-02-02, tid: 5, dob: '2010-02-02'}
          - {person_id: 6-1996-04-30, tid: 6, dob: '1996-04-30'}
    expect:
      rows:
        - {award_id: world_best_xi, season: 2022, person_id: 5-1988-08-21, player_tid: 5, is_final: true}
        - {award_id: world_best_xi, season: 2028, person_id: 6-1996-04-30, player_tid: 6, is_final: false}
        - {award_id: world_best_xi_all_time, season: 2022, person_id: 5-1988-08-21, player_tid: 5, is_final: true}

  - name: person_origin_resolves_the_academy
    description: >
      A person's origin is his oldest career line's club: a youth side's line counts for the
      club whose academy it is (origin_youth_team_tid names the academy), a recorded team's
      for its club, and a line at a club the save holds no record for keeps its tid.
    model: dim_person
    given:
      - input: ref('int_persons')
        rows:
          - {person_id: a, tid: 1, dob: '2008-01-01', name: Johan Maarup}
          - {person_id: b, tid: 2, dob: '1999-01-01', name: B}
          - {person_id: c, tid: 3, dob: '1990-01-01', name: C}
          - {person_id: d, tid: 4, dob: '1970-01-01', name: Staff}
      - input: ref('int_player_career_lines')
        rows:
          - {person_id: a, line_index: 0, season: 2024, club_tid: 65189}
          - {person_id: a, line_index: 1, season: 2025, club_tid: 346}
          - {person_id: b, line_index: 0, season: 2018, club_tid: 7296}
          - {person_id: c, line_index: 0, season: 2010, club_tid: 6863}
      - input: ref('int_team_clubs')
        rows:
          - {team_tid: 346, club_tid: 346, is_youth_side: false}
          - {team_tid: 7296, club_tid: 346, is_youth_side: false}
          - {team_tid: 65189, club_tid: 346, is_youth_side: true}
    expect:
      rows:
        - {person_id: a, origin_team_tid: 65189, origin_club_tid: 346, origin_youth_team_tid: 65189, origin_season: 2024}
        - {person_id: b, origin_team_tid: 7296, origin_club_tid: 346, origin_youth_team_tid: null, origin_season: 2018}
        - {person_id: c, origin_team_tid: 6863, origin_club_tid: 6863, origin_youth_team_tid: null, origin_season: 2010}
        - {person_id: d, origin_team_tid: null, origin_club_tid: null, origin_youth_team_tid: null, origin_season: null}
