      - name: our_fouls
        description: '{{ doc("fouls") }}'
      - name: opp_fouls
        description: '{{ doc("fouls") }}'
  - name: site_goals
    description: Each goal in the managed (senior) team's matches with detail, both sides', with its assister.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, event_index]}}
    columns:
      - name: match_id
        description: '{{ doc("match_id") }}'
      - name: event_index
        description: '{{ doc("event_index") }}'
      - name: season
        description: '{{ doc("season") }}'
      - name: match_date
