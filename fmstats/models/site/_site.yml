      - name: dribbles
        description: '{{ doc("dribbles") }}'
      - name: shots
        description: '{{ doc("shots") }}'
      - name: shots_on_target
        description: '{{ doc("shots_on_target") }}'
      - name: mistakes
        description: '{{ doc("mistakes") }}'
      - name: yellows
        description: '{{ doc("yellows") }}'
      - name: xg
