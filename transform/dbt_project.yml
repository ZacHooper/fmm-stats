# The T of extract-load-transform for the new layers: stg (one model per raw table), int
# (joins and rules) and, from step 13 on, the dim_/fact_ tables (mart). The old mart
# (fmstats/mart.py) is not built here; it reads int through the compatibility views.
name: fm_stats
version: "1.0"
profile: fm_stats
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  partial_parse: true

models:
  fm_stats:
    stg:
      +schema: stg
      +materialized: view
    int:
      +schema: int
      +materialized: view
    legacy:                   # the old shapes fmstats/mart.py reads (fmstats/compat.py)
      +schema: legacy
      +materialized: view
    mart:                     # the dim_ / fact_ tables, beside the old mart views
      +schema: mart
      +materialized: table
    site:                     # the web app's marts: one view per thing a page shows, read by
      +schema: site           # scripts/export_site.py (data-layers step 17)
      +materialized: view

vars:
  # What the SQL is generated from: the raw schema's attribute columns and codes, mirrored
  # from fmstats/contract.py (tests/test_boundary.py checks the two agree).
  attr_order: [Aerial, Crossing, Dribbling, Shooting, Passing, Tackling, Technique,
               Aggression, Creativity, Decisions, Leadership, Movement, Positioning,
               Teamwork, Pace, Stamina, Strength, Agility, Handling, Kicking, Reflexes,
               Communication, Throwing]
  exact_single: [Pace, Strength, Stamina, Technique, Aggression, Leadership, Agility]
  attribute_columns:          # record offset -> attribute-record column (stg_attribute_model)
    "-34": crossing_src
    "-33": dribbling_src
    "-32": tackling_src
    "-31": finishing_src
    "-30": long_shot_src
    "-27": passing_src
    "-26": decision_src
    "-12": creativity_src
    "-11": movement_src
    "-10": positioning_src
    "-7": handling_src
    "-6": kicking_src
    "-4": aerial_gk_src
    "-3": reflexes_src
    "-2": communication_src
    "-1": throwing_src
    "-29": heading_src
    "-25": unselfishness_src
    "-24": pace_src
    "-23": strength_src
    "-22": stamina_src
    "-21": technique_src
    "-19": aggression_src
    "-16": leadership_src
    "-5": agility_src
    "-28": jumping
    "-20": consistency
    "-18": big_match
    "-17": injury_prone
    "-15": versatility
    "-14": set_pieces
    "-13": penalty
    "-9": work_rate
    "-8": flair
  hidden_attributes: [jumping, consistency, big_match, injury_prone, versatility, set_pieces,
                      penalty, work_rate, flair]
  composites:                 # clip(floor(w1*b1 + w2*b2 + offset), 1, 20)
    Teamwork: {columns: [unselfishness_src, work_rate], w: [0.50, 0.50, 0.0], estimate: false}
    Aerial: {columns: [heading_src, jumping], w: [0.24, 0.76, 0.8], estimate: true}
  personality: [adaptability, ambition, determination, loyalty, pressure, professionalism,
                sportsmanship, temperament]
  positions: [GK, SW, DL, DC, DR, DMC, ML, MC, MR, AML, AMC, AMR, ST, DML, DMR]
  # A match line's position code where it differs from the positions' own
  # (stg_match_player_stats): the match table's striker is FC.
  match_position_codes: {FC: ST}
  team_types: {0: first, 1: national, 2: reserve, 3: national_u21}  # club_details.club_type
  # A club_type-0 record that names a parent club is a second side in the senior pyramid
  # (Las Palmas C, Cartagena B), not a first team (int_teams).
  b_team: {club_type: 0, team_type: b_team}
  club_lists: [31, 61]        # first and last scrapbook list holding our squad
  # The World Best XI pools (fact_player_award): one scrapbook list per season, first and
  # last; and the All-Time pool's current copy (64 holds it as of last season's end).
  world_best_xi_lists: [0, 30]
  world_best_xi_all_time_list: 62
  awards:
    world_best_xi: World Best XI pool
    world_best_xi_all_time: World Best XI All-Time pool
  contracted: 135             # the training row's contract flag (0x87)
  no_id16: 65535              # a u16 id field's "none" (0xFFFF); stg models read it as NULL
  no_id32: 4294967295         # the same in a u32 field (0xFFFFFFFF)
  no_id8: 255                 # the same in a u8 field (0xFF): no stage, no minute
  no_sid: ffffffff            # a person's attribute-record link when he has none (staff)
  # Displayed manager Style from the staff record's attacking_intent (<= ceiling), and the
  # reputation tier from world_reputation (< ceiling); fmparser/tables/staff.py
  staff_style_bands: [[7, Defensive], [13, Normal], [20, Attacking]]
  staff_tier_bands: [[3000, Regional], [5800, National], [1000000000, Continental]]
  wage_gbp_per_unit: 520
  stage_formats: {0: knockout, 1: league, 2: group}   # competition_rounds.stage_type
  # A league's regular stage must hold at least this share of the league's clubs
  # (int_stage_competitions; mart.league_tables uses the same rule), so a cup group drawn from
  # one division is not that division.
  league_min_share: 0.8
  # A competition of these types (stg_competitions.type) is played as a league, so a stage
  # of it the rules do not describe (a reserve group has no rules member) is a league stage
  # (int_standings).
  league_competition_types: [league, reserve_league]
  # A match's length in minutes, without and with extra time (int_player_matches).
  match_minutes: {regulation: 90, extra_time: 120}
  # match_id packs a match's date and its two team tids into one BIGINT (macros/match_id.sql);
  # every tid must stay below this base.
  match_id_tid_base: 100000
  # The team stats the match table holds per side (stg_matches home_ / away_), carried onto
  # fact_team_match for our matches.
  team_match_stats: [shots, shots_on_target, passes, passes_completed, tackles, tackles_won,
                     crosses, interceptions]
  # The role a position's match ratings are compared within (int_player_match_ratings).
  rating_roles: {GK: GK, DC: Centre-back, DL: Full-back, DR: Full-back, DML: Wing-back,
                 DMR: Wing-back, DMC: DM, MC: Central mid, ML: Wide mid, MR: Wide mid,
                 AMC: Attacking mid, AML: Winger, AMR: Winger, ST: Forward}
  starters: 11                # a match line's pos_order up to this is a starter
  # Each match period by the last minute it holds (int_match_events); a shoot-out kick is
  # its own period, whatever minute the save gives it.
  match_periods: [[45, first_half], [90, second_half], [105, extra_time_first_half],
                  [120, extra_time_second_half]]
  shootout_period: shootout
  # Event types by name (raw.event_types) that the models give a role (int_event_types):
  # a sending-off ends a player's match, a shoot-out kick is not a goal, and a scoring
  # event counts for the player's side or, an own goal, for the other side.
  sending_off_events: [red_card]
  shootout_events: [shootout_goal, shootout_miss]
  scoring_events: {goal: for, penalty: for, own_goal: against}
  progress_bits:              # Player Progress status bitfield (stg_player_progress)
    is_injured: 3             # bits 0-1
    is_off_season: 16         # bit 4
    is_on_loan: 32            # bit 5
  # Spells read from those bits (int_progress_spells): flagged weeks further apart than
  # gap_days are two spells. A loan's gap spans the off-season week, when the series pauses.
  progress_spells:
    injured: {flag: is_injured, gap_days: 8}
    off_season: {flag: is_off_season, gap_days: 8}
    on_loan: {flag: is_on_loan, gap_days: 22}
  # A career-history line's transfer fee code (stg_player_history_seasons): below the floor it
  # is the fee in units of fee_unit_gbp; fee_contract_ended (0xFFFC) is a contract run out.
  # A loan is a club's own side listing another club's player (int_loan_spells); a national
  # side's call-up is not one.
  loan_team_types: [first, b_team, reserve]
  # The training row's squad status of a player out on loan (fmparser/tables/training.py).
  loaned_out_status: 65
  # A club's youth side has no record of its own; its tid is this minus its club's (the u16
  # complement: Frem 346 -> 65189; int_transfers, mart.youth_clubs).
  youth_tid_base: 65535
  fee_code_floor: 65000
  fee_unit_gbp: 1000
  fee_contract_ended: 65532
  scrapbook_max_age_days: 365
  # The transfer-value model (int_player_value, seeds/value_model.csv): age enters capped at
  # value_age_cap, and value_trusted_band is the range it was validated in, in GBP.
  value_age_cap: 28
  value_trusted_band: [20000, 5000000]
  # The web app's marts (models/site). A league's skill_idx needs this many rated players.
  site_skill_min_players: 20
  # Squad registration, a house rule (docs/danish-registration-rules.md; int_squad_training,
  # site_registration). The home-grown window runs from the season a player turns the first
  # age to the end of the season he turns the second; a month is days_in_month days.
  home_grown_window_ages: [15, 22]
  home_grown_months: 36
  days_in_month: 30.44
  # The registration rules for the managed club's league: the A-list cap, the home-grown
  # minimums (overall, and trained at the club) that bind in the top hg_tiers tiers, the
  # B-list age (under it at the last new year before the season's second calendar year) and
  # the youngest age on a matchday squad.
  registration: {a_list_max: 25, hg_min: 8, hg_club_min: 4, hg_tiers: 2,
                 b_list_under_age: 21, min_matchday_age: 16}
  # A competition's groups start within this many days of each other (site_matches' group
  # letter).
  site_group_draw_days: 3
  # A player's development word: the first band whose share of his potential his ability
  # reaches (site_players).
  site_development_bands: [[0.97, At his ceiling], [0.90, Nearly there], [0.75, Developing],
                           [0, Lots to come]]
  # The personality and hidden attributes the profile sheet shows, in its order.
  site_profile_traits: [adaptability, ambition, determination, loyalty, pressure,
                        professionalism, sportsmanship, temperament, jumping, consistency,
                        big_match, injury_prone, versatility, set_pieces, penalty, work_rate,
                        flair]
