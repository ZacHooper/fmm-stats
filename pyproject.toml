[project]
name = "fm-parser-loader"
version = "0.1.0"
description = "DuckDB ETL + query CLI over fm-parser extract outputs"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
]

# The extractors (extract.py, dump_*.py, fmparser/*) are pure-stdlib and must stay
# dependency-free. duckdb is imported only by load_duckdb.py / fmq.py, run via uv.
# package = false: this is a workspace of scripts, not an installable package.
[tool.uv]
package = false

[project.optional-dependencies]
# The save's tail is a zstd-compressed archive (fmparser/archive.py). zstd only enters the
# stdlib in 3.14, so reading it needs this package; nothing else in the parser imports it
# and archive.py raises a message naming this extra if it is missing.
archive = [
    "zstandard>=0.22",
]
