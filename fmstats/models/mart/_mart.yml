version: 2
models:
  - name: dim_position
    description: >
      The fifteen positions: code, unit, display order.
    data_tests:
      - unique_combination: {arguments: {columns: [position]}}
    columns:
      - name: position
        description: '{{ doc("position") }}'
      - name: unit
        description: '{{ doc("unit") }}'
      - name: display_order
        description: '{{ doc("display_order") }}'
  - name: dim_role
    description: >
      The player roles by id; a role names no position.
    data_tests:
      - unique_combination: {arguments: {columns: [role_id]}}
    columns:
      - name: role_id
        description: '{{ doc("role_id") }}'
      - name: name
        description: 'The role''s name (Poacher, Full-Back). {{ doc("name") }}'
      - name: is_inferred
        description: '{{ doc("is_inferred") }}'
  - name: dim_city
    description: >
      Each city, as its latest snapshot gives it.
    data_tests:
      - unique_combination: {arguments: {columns: [city_id]}}
    columns:
      - name: city_id
        description: '{{ doc("city_id") }}'
      - name: uid
        description: 'The city''s database id. {{ doc("uid") }}'
      - name: nation_id
        description: 'The city''s nation. {{ doc("nation_id") }}'
      - name: latitude
        description: '{{ doc("latitude") }}'
      - name: longitude
        description: '{{ doc("longitude") }}'
      - name: attraction
        description: '{{ doc("attraction") }}'
      - name: region_id
        description: '{{ doc("region_id") }}'
      - name: last_seen_date
        description: '{{ doc("last_seen_date") }}'
  - name: dim_stadium
    description: >
      Each stadium and its city; name and capacity are on fact_stadium_snapshot.
    data_tests:
      - unique_combination: {arguments: {columns: [stadium_id]}}
    columns:
      - name: stadium_id
        description: '{{ doc("stadium_id") }}'
      - name: uid
        description: 'The stadium''s database id. {{ doc("uid") }}'
      - name: city_id
        description: 'The stadium''s city. {{ doc("city_id") }}'
      - name: last_seen_date
        description: '{{ doc("last_seen_date") }}'
  - name: dim_nation
    description: >
      Each nation as a place; ranking, coefficients and languages are on fact_nation_snapshot.
    data_tests:
      - unique_combination: {arguments: {columns: [nation_id]}}
    columns:
      - name: nation_id
        description: '{{ doc("nation_id") }}'
      - name: name
        description: 'The nation''s name. {{ doc("name") }}'
      - name: nationality
        description: '{{ doc("nationality") }}'
      - name: code
        description: '{{ doc("code") }}'
      - name: continent_id
        description: '{{ doc("continent_id") }}'
      - name: capital_city_id
        description: '{{ doc("capital_city_id") }}'
      - name: national_stadium_id
        description: '{{ doc("national_stadium_id") }}'
      - name: rival_nation_id
        description: '{{ doc("rival_nation_id") }}'
      - name: last_seen_date
        description: '{{ doc("last_seen_date") }}'
  - name: fact_nation_snapshot
    description: >
      Each nation on each snapshot: ranking and the two histories.
    data_tests:
      - unique_combination: {arguments: {columns: [nation_id, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [nation_id]
            to: ref('dim_nation')
            to_columns: [nation_id]
    columns:
      - name: nation_id
        description: '{{ doc("nation_id") }}'
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: is_ranked
        description: '{{ doc("is_ranked") }}'
      - name: world_ranking
        description: '{{ doc("world_ranking") }}'
      - name: ranking_points
        description: '{{ doc("ranking_points") }}'
      - name: ranking_history
        description: '{{ doc("ranking_history") }}'
      - name: coefficient_history
        description: '{{ doc("coefficient_history") }}'
      - name: languages
        description: '{{ doc("languages") }}'
      - name: is_current
        description: '{{ doc("is_current") }}'
  - name: dim_club
    description: >
      Each club: its first team's name, nations, and static colours/kits taken from the latest snapshot, plus shirt_colours, its home shirt as [main, second].
    data_tests:
      - unique_combination: {arguments: {columns: [club_tid]}}
    columns:
      - name: club_tid
        description: '{{ doc("club_tid") }}'
      - name: name
        description: 'The club''s name: its first team''s. {{ doc("name") }}'
      - name: nation_id
        description: 'The club''s home nation. {{ doc("nation_id") }}'
      - name: league_nation_id
        description: '{{ doc("league_nation_id") }}'
      - name: colours
        description: '{{ doc("colours") }}'
      - name: kits
        description: '{{ doc("kits") }}'
      - name: shirt_colours
        description: '{{ doc("shirt_colours") }}'
      - name: last_seen_date
        description: '{{ doc("last_seen_date") }}'
  - name: dim_team
    description: >
      Each team, the side that plays, with the club that owns it and its team type.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid]}}
      - relationship_combination:
          arguments:
            columns: [club_tid]
            to: ref('dim_club')
            to_columns: [club_tid]
    columns:
      - name: team_tid
        description: '{{ doc("team_tid") }}'
      - name: club_tid
        description: 'The club that owns the team. {{ doc("club_tid") }}'
      - name: name
        description: 'The team''s long name. {{ doc("name") }}'
      - name: team_type
        description: '{{ doc("team_type") }}'
      - name: is_first_team
        description: '{{ doc("is_first_team") }}'
      - name: club_type
        description: '{{ doc("club_type") }}'
      - name: last_seen_date
        description: '{{ doc("last_seen_date") }}'
  - name: fact_club_snapshot
    description: >
      Each club on each snapshot: what its teams share (ground and affiliates; colours and kits live on dim_club).
    data_tests:
      - unique_combination: {arguments: {columns: [club_tid, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [club_tid]
            to: ref('dim_club')
            to_columns: [club_tid]
      - relationship_combination:
          arguments:
            columns: [stadium_id]
            to: ref('dim_stadium')
            to_columns: [stadium_id]
    columns:
      - name: club_tid
        description: '{{ doc("club_tid") }}'
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: stadium_id
        description: 'The club''s ground (its first team''s). {{ doc("stadium_id") }}'
      - name: affiliates
        description: '{{ doc("affiliates") }}'
      - name: is_current
        description: '{{ doc("is_current") }}'
  - name: fact_team_snapshot
    description: >
      Each team on each snapshot: what each side holds on its own.
    data_tests:
      - unique_combination: {arguments: {columns: [team_tid, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
      - relationship_combination:
          arguments:
            columns: [stadium_id]
            to: ref('dim_stadium')
            to_columns: [stadium_id]
    columns:
      - name: team_tid
        description: '{{ doc("team_tid") }}'
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: club_tid
        description: 'The club that owns the team. {{ doc("club_tid") }}'
      - name: reputation
        description: 'The team''s, 1-10,000: a first team and its reserve side differ.
          {{ doc("reputation") }}'
      - name: status
        description: '{{ doc("status") }}'
      - name: training_facilities
        description: '{{ doc("training_facilities") }}'
      - name: youth_facilities
        description: '{{ doc("youth_facilities") }}'
      - name: league_cid
        description: '{{ doc("league_cid") }}'
      - name: other_division_cid
        description: '{{ doc("other_division_cid") }}'
      - name: last_league_cid
        description: '{{ doc("last_league_cid") }}'
      - name: last_league_position
        description: '{{ doc("last_league_position") }}'
      - name: stadium_id
        description: '{{ doc("stadium_id") }}'
      - name: squad_size
        description: '{{ doc("squad_size") }}'
      - name: staff_size
        description: '{{ doc("staff_size") }}'
      - name: is_current
        description: '{{ doc("is_current") }}'
  - name: fact_stadium_snapshot
    description: >
      Each stadium on each snapshot: name, capacity, expansion capacity.
    data_tests:
      - unique_combination: {arguments: {columns: [stadium_id, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [stadium_id]
            to: ref('dim_stadium')
            to_columns: [stadium_id]
    columns:
      - name: stadium_id
        description: '{{ doc("stadium_id") }}'
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: name
        description: 'The stadium''s name on the snapshot. {{ doc("name") }}'
      - name: capacity
        description: '{{ doc("capacity") }}'
      - name: expansion_capacity
        description: '{{ doc("expansion_capacity") }}'
      - name: is_current
        description: '{{ doc("is_current") }}'
  - name: dim_competition
    description: >
      Each competition: names, type, nation, tier and parent.
    data_tests:
      - unique_combination: {arguments: {columns: [cid]}}
    columns:
      - name: cid
        description: '{{ doc("cid") }}'
      - name: uid
        description: 'The competition''s database id. {{ doc("uid") }}'
      - name: name
        description: 'The competition''s name. {{ doc("name") }}'
      - name: short_name
        description: '{{ doc("short_name") }}'
      - name: code
        description: '{{ doc("code") }}'
      - name: type
        description: '{{ doc("type") }}'
      - name: type_id
        description: '{{ doc("type_id") }}'
      - name: nation_id
        description: 'The competition''s nation; NULL for an international one.
          {{ doc("nation_id") }}'
      - name: tier_index
        description: '{{ doc("tier_index") }}'
      - name: parent_cid
        description: '{{ doc("parent_cid") }}'
      - name: last_seen_date
        description: '{{ doc("last_seen_date") }}'
  - name: fact_competition_snapshot
    description: >
      Each competition on each snapshot: reputation.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, snapshot_date]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
    columns:
      - name: cid
        description: '{{ doc("cid") }}'
      - name: snapshot_date
        description: '{{ doc("snapshot_date") }}'
      - name: reputation
        description: 'The competition''s, 0-200. {{ doc("reputation") }}'
      - name: is_current
        description: '{{ doc("is_current") }}'
  - name: dim_stage
    description: >
      Each stage of a competition season: format, name, teams, groups, final stage.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
    columns:
      - name: cid
        description: '{{ doc("cid") }}'
      - name: competition_season
        description: '{{ doc("competition_season") }}'
      - name: stage_index
        description: '{{ doc("stage_index") }}'
      - name: stage_format
        description: '{{ doc("stage_format") }}'
      - name: name
        description: 'The stage''s name from its rules. {{ doc("name") }}'
      - name: stage_code
        description: '{{ doc("stage_code") }}'
      - name: stage_type_code
        description: '{{ doc("stage_type_code") }}'
      - name: stage_teams
        description: '{{ doc("stage_teams") }}'
      - name: n_groups
        description: '{{ doc("n_groups") }}'
      - name: is_final_stage
        description: '{{ doc("is_final_stage") }}'
  - name: dim_round
    description: >
      Each round of a knockout stage: name, teams, legs.
    data_tests:
      - unique_combination: {arguments: {columns: [cid, competition_season, stage_index, round_index]}}
      - relationship_combination:
          arguments:
            columns: [cid, competition_season, stage_index]
            to: ref('dim_stage')
            to_columns: [cid, competition_season, stage_index]
    columns:
      - name: cid
        description: '{{ doc("cid") }}'
      - name: competition_season
        description: '{{ doc("competition_season") }}'
      - name: stage_index
        description: '{{ doc("stage_index") }}'
      - name: round_index
        description: '{{ doc("round_index") }}'
      - name: name
        description: 'The round''s name from its rules. {{ doc("name") }}'
      - name: round_teams
        description: '{{ doc("round_teams") }}'
      - name: legs
        description: '{{ doc("legs") }}'
  - name: dim_match
    description: >
      Every match in the world: competition, stage and round where known, tie and leg, how it was decided, has_detail for ours.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id]}}
      - unique_combination: {arguments: {columns: [match_date, home_team_tid, away_team_tid]}}
      - relationship_combination:
          arguments:
            columns: [cid]
            to: ref('dim_competition')
            to_columns: [cid]
      - relationship_combination:
          arguments:
            columns: [home_team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
      - relationship_combination:
          arguments:
            columns: [away_team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
    columns:
      - name: match_id
        description: '{{ doc("match_id") }}'
      - name: match_date
        description: '{{ doc("match_date") }}'
      - name: home_team_tid
        description: '{{ doc("home_team_tid") }}'
        data_tests:
          - in_range: {arguments: {min_value: 0, max_value: "{{ var('match_id_tid_base') - 1 }}"}}
      - name: away_team_tid
        description: '{{ doc("away_team_tid") }}'
        data_tests:
          - in_range: {arguments: {min_value: 0, max_value: "{{ var('match_id_tid_base') - 1 }}"}}
      - name: competition_season
        description: '{{ doc("competition_season") }}'
      - name: cid
        description: '{{ doc("cid") }}'
      - name: competition_source
        description: '{{ doc("competition_source") }}'
      - name: stage_index
        description: '{{ doc("stage_index") }}'
      - name: round_index
        description: '{{ doc("round_index") }}'
      - name: matchday_index
        description: '{{ doc("matchday_index") }}'
      - name: tie_id
        description: '{{ doc("tie_id") }}'
      - name: leg
        description: '{{ doc("leg") }}'
      - name: decided_by
        description: '{{ doc("decided_by") }}'
      - name: score_display
        description: '{{ doc("score_display") }}'
      - name: has_detail
        description: '{{ doc("has_detail") }}'
      - name: attendance
        description: '{{ doc("attendance") }}'
  - name: fact_team_match
    description: >
      Each match twice, once per side: goals, shoot-out, result, points.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, team_tid]}}
      - relationship_combination:
          arguments:
            columns: [match_id]
            to: ref('dim_match')
            to_columns: [match_id]
    columns:
      - name: match_id
        description: '{{ doc("match_id") }}'
      - name: team_tid
        description: '{{ doc("team_tid") }}'
      - name: opponent_tid
        description: '{{ doc("opponent_tid") }}'
      - name: venue
        description: '{{ doc("venue") }}'
      - name: goals_for
        description: 'The final score, after extra time. {{ doc("goals_for") }}'
      - name: goals_against
        description: '{{ doc("goals_against") }}'
      - name: pens_for
        description: '{{ doc("pens_for") }}'
      - name: pens_against
        description: '{{ doc("pens_against") }}'
      - name: result
        description: '{{ doc("result") }}'
      - name: points
        description: '{{ doc("points") }}'
      - name: formation
        description: '{{ doc("formation") }}'
      - name: shots
        description: '{{ doc("shots") }}'
      - name: shots_on_target
        description: '{{ doc("shots_on_target") }}'
      - name: passes
        description: '{{ doc("passes") }}'
      - name: passes_completed
        description: '{{ doc("passes_completed") }}'
      - name: tackles
        description: '{{ doc("tackles") }}'
      - name: tackles_won
        description: '{{ doc("tackles_won") }}'
      - name: crosses
        description: '{{ doc("crosses") }}'
      - name: interceptions
        description: '{{ doc("interceptions") }}'
  - name: dim_event_type
    description: >
      Every match event type, named or not, with its role in the score and in a player's minutes.
    data_tests:
      - unique_combination: {arguments: {columns: [event_type_code]}}
    columns:
      - name: event_type_code
        description: '{{ doc("event_type_code") }}'
      - name: event_type
        description: '{{ doc("event_type") }}'
      - name: is_appearance_ending
        description: '{{ doc("is_appearance_ending") }}'
      - name: is_shootout
        description: '{{ doc("is_shootout") }}'
      - name: scores_for
        description: '{{ doc("scores_for") }}'
  - name: dim_period
    description: >
      The periods of a match in order, with the minutes each holds.
    data_tests:
      - unique_combination: {arguments: {columns: [period]}}
    columns:
      - name: period
        description: '{{ doc("period") }}'
      - name: period_order
        description: '{{ doc("period_order") }}'
      - name: first_minute
        description: '{{ doc("first_minute") }}'
      - name: last_minute
        description: '{{ doc("last_minute") }}'
  - name: fact_player_match
    description: >
      Each player's line in our own matches, both sides: is_starter, has_appeared, minutes with extra time,
      full-time position, raw rating, position-adjusted rating (rating_adj), rating_role, the game's
      Player of the Match, and match performance stats.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, player_tid]}}
      - unique_combination:
          arguments: {columns: [match_id]}
          config: {where: "is_player_of_match"}
      - relationship_combination:
          arguments:
            columns: [match_id]
            to: ref('dim_match')
            to_columns: [match_id]
      - relationship_combination:
          arguments:
            columns: [team_tid]
            to: ref('dim_team')
            to_columns: [team_tid]
      - relationship_combination:
          arguments:
            columns: [position]
            to: ref('dim_position')
            to_columns: [position]
    columns:
      - name: match_id
        description: '{{ doc("match_id") }}'
      - name: player_tid
        description: 'The player on the line. {{ doc("tid") }}'
      - name: person_id
        description: 'NULL for a placeholder player with no person record (reserve matches''
          fillers). {{ doc("person_id") }}'
      - name: team_tid
        description: 'The player''s side. {{ doc("team_tid") }}'
      - name: opponent_tid
        description: '{{ doc("opponent_tid") }}'
      - name: lineup_order
        description: '{{ doc("lineup_order") }}'
      - name: position
        description: '{{ doc("position") }}'
      - name: rating_role
        description: '{{ doc("rating_role") }}'
      - name: is_starter
        description: '{{ doc("is_starter") }}'
      - name: has_appeared
        description: '{{ doc("has_appeared") }}'
      - name: is_player_of_match
        description: '{{ doc("is_player_of_match") }}'
      - name: sub_on_minute
        description: '{{ doc("sub_on_minute") }}'
      - name: sub_off_minute
        description: '{{ doc("sub_off_minute") }}'
      - name: sent_off_minute
        description: '{{ doc("sent_off_minute") }}'
      - name: minutes
        description: '{{ doc("minutes") }}'
        data_tests:
          - not_null
          - in_range: {arguments: {min_value: 0, max_value: 120}}
      - name: rating
        description: '{{ doc("rating") }}'
      - name: rating_adj
        description: '{{ doc("rating_adj") }}'
      - name: goals
        description: '{{ doc("goals") }}'
      - name: assists
        description: '{{ doc("assists") }}'
      - name: passes
        description: '{{ doc("passes") }}'
      - name: passes_completed
        description: '{{ doc("passes_completed") }}'
      - name: key_passes
        description: '{{ doc("key_passes") }}'
      - name: tackles
        description: '{{ doc("tackles") }}'
      - name: tackles_won
        description: '{{ doc("tackles_won") }}'
      - name: interceptions
        description: '{{ doc("interceptions") }}'
      - name: headers
        description: '{{ doc("headers") }}'
      - name: headers_won
        description: '{{ doc("headers_won") }}'
      - name: crosses
        description: '{{ doc("crosses") }}'
      - name: crosses_completed
        description: '{{ doc("crosses_completed") }}'
      - name: dribbles
        description: '{{ doc("dribbles") }}'
      - name: mistakes
        description: '{{ doc("mistakes") }}'
      - name: mistakes_to_goal
        description: '{{ doc("mistakes_to_goal") }}'
      - name: shots
        description: '{{ doc("shots") }}'
      - name: shots_on_target
        description: '{{ doc("shots_on_target") }}'
      - name: condition
        description: '{{ doc("condition") }}'
      - name: yellows
        description: '{{ doc("yellows") }}'
  - name: fact_match_event
    description: >
      The events of our own matches in order: minute, period, type, player and the side it counts for.
    data_tests:
      - unique_combination: {arguments: {columns: [match_id, event_index]}}
      - relationship_combination:
          arguments:
            columns: [match_id]
            to: ref('dim_match')
            to_columns: [match_id]
      - relationship_combination:
          arguments:
            columns: [event_type_code]
            to: ref('dim_event_type')
            to_columns: [event_type_code]
      - relationship_combination:
          arguments:
            columns: [period]
            to: ref('dim_period')
            to_columns: [period]
    columns:
      - name: match_id
        description: '{{ doc("match_id") }}'
      - name: event_index
        description: '{{ doc("event_index") }}'
      - name: minute
        description: '{{ doc("minute") }}'
      - name: added_minutes
        description: '{{ doc("added_minutes") }}'
      - name: period
        description: '{{ doc("period") }}'
        data_tests: [not_null]
      - name: event_type_code
        description: '{{ doc("event_type_code") }}'
      - name: event_type
        description: '{{ doc("event_type") }}'
      - name: player_tid
        description: 'The player the event names. {{ doc("tid") }}'
      - name: person_id
        description: 'The player the event names; NULL where the snapshot holds no person record for
          him. {{ doc("person_id") }}'
      - name: player_team_tid
        description: '{{ doc("player_team_tid") }}'
      - name: team_tid
        description: 'The side the event counts for: the player''s, except an own goal''s (the other
          side). {{ doc("team_tid") }}'
        data_tests: [not_null]
  - name: mart_tie_results
    description: >
      Each knockout tie: teams, aggregate, shoot-out, how it was decided and the winner. A view.
    data_tests:
      - unique_combination: {arguments: {columns: [tie_id]}}
      - relationship_combination:
          arguments:
            columns: [cid, competition_season, stage_index]
            to: ref('dim_stage')
            to_columns: [cid, competition_season, stage_index]
    columns:
      - name: tie_id
        description: '{{ doc("tie_id") }}'
      - name: cid
        description: '{{ doc("cid") }}'
      - name: competition_season
        description: '{{ doc("competition_season") }}'
      - name: stage_index
        description: '{{ doc("stage_index") }}'
      - name: round_index
        description: '{{ doc("round_index") }}'
      - name: legs
        description: 'The round''s legs per tie. {{ doc("legs") }}'
      - name: legs_played
        description: '{{ doc("legs_played") }}'
      - name: first_match_date
        description: 'The first leg''s date. {{ doc("first_match_date") }}'
      - name: last_match_date
