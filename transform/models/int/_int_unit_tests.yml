      rows:
        - {matchday: 1, through_date: '2025-03-01', team_tid: 1, position: 1, played: 1, points: 3, goal_difference: 2}
        - {matchday: 1, through_date: '2025-03-01', team_tid: 3, position: 2, played: 0, points: 0, goal_difference: 0}
