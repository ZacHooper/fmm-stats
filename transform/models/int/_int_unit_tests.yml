  - name: contracts_rebuilt_by_start_date
    description: >
      A contract is a run of snapshots with one stored start date at one club: a move to the
      reserves or a wage rise under the same start date is the same contract. A day-one start
      date after the first snapshot holding the contract reads NULL. Each contract ends
