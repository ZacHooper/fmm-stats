      - name: Stamina
        description: '{{ doc("stamina") }}'
      - name: Strength
        description: '{{ doc("strength") }}'
      - name: Agility
        description: '{{ doc("agility") }}'
      - name: Handling
        description: '{{ doc("handling") }}'
      - name: Kicking
        description: '{{ doc("kicking") }}'
      - name: Reflexes
        description: '{{ doc("reflexes") }}'
      - name: Communication
        description: '{{ doc("communication") }}'
      - name: Throwing
        description: '{{ doc("throwing") }}'
      - name: squad_number
        description: '{{ doc("squad_number") }}'
      - name: height_cm
        description: '{{ doc("height_cm") }}'
      - name: weight_kg
        description: '{{ doc("weight_kg") }}'
      - name: origin_club_tid
        description: '{{ doc("origin_club_tid") }}'
      - name: origin_club
        description: '{{ doc("origin_club") }}'
      - name: capital_eligible
        description: '{{ doc("is_capital_eligible") }}'
      - name: nationality
